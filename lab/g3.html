<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>حديقة الأصوات — عينة</title>
<link rel="stylesheet" href="sb.css?v=5">
<style>
  :root{--w:min(94vw,520px)}
  .stage{position:relative;width:var(--w);aspect-ratio:735/659;border-radius:20px;overflow:hidden;border:4px solid #fff;
    box-shadow:0 6px 0 #d9b878,0 14px 28px #4a2d0a40;background:url(assets/sb/garden3.jpg) center/100% 100% no-repeat}
  .pot-hit{position:absolute;top:46%;height:29%;border:0;background:transparent;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .lab{position:absolute;left:50%;top:67%;transform:translate(-50%,-50%);min-width:72%;padding:.3em .3em .34em;border-radius:999px;background:#fffaf0;
    font-family:inherit;font-weight:800;font-size:calc(var(--w)*.07);color:var(--sb-navy);box-shadow:0 3px 0 #0002;text-align:center;line-height:1.2}
  .pot-hit.bad .lab{background:#f6c3c3;animation:sbShk .4s}
  .pot-hit.good .lab{background:#cdeecb}
  .can{position:absolute;left:0;top:2%;width:31%;height:38%;border:0;background:transparent;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .can.pulse{animation:cp 1.2s ease-in-out 3}
  @keyframes cp{50%{box-shadow:0 0 0 6px #ffffffaa,0 0 24px 10px #ffe48f;border-radius:50%}}
  .fl{position:absolute;width:21%;transform:translateX(-50%) scale(0);transform-origin:50% 100%;pointer-events:none;bottom:50%}
  .fl.grow{animation:flgrow .8s cubic-bezier(.34,1.56,.64,1) forwards}
  @keyframes flgrow{to{transform:translateX(-50%) scale(1)}}
  @keyframes sbShk{0%,100%{transform:translate(-50%,-50%)}25%{transform:translate(calc(-50% - 7px),-50%)}75%{transform:translate(calc(-50% + 7px),-50%)}}
  #g3msg{text-align:center;min-height:26px;font-size:18px;font-weight:800;color:var(--sb-pink-d);margin-top:8px;background:#fff6e9e6;border-radius:12px;padding:2px 14px}
  #rounds{display:flex;gap:8px;justify-content:center;margin:8px 0 0}
  #rounds .sb-star{width:26px;height:26px}
  .sb-teacher{height:min(18vh,150px)!important}
</style>
</head>
<body>
<div class="sb-page" style="background:linear-gradient(#cfe9b8,#f5e3b5)">
  <div class="sb-topbar">
    <a class="sb-roundbtn" href="index.html" aria-label="كل العينات">🏠</a>
    <div class="sb-plaque"><h1>حديقة الأصوات</h1></div>
    <span class="sb-roundbtn" aria-hidden="true" style="visibility:hidden"></span>
  </div>
  <div class="stage" id="stage">
    <button class="can pulse" id="listen" type="button" aria-label="اسمعي"></button>
  </div>
  <div id="rounds"><div class="sb-star"></div><div class="sb-star"></div><div class="sb-star"></div></div>
  <div id="g3msg"></div>
</div>
<script src="sb.js?v=5"></script>
<script>
SB.teacher('full');
(function(){
"use strict";
var A='../assets/';
var ROUNDS=[
 {target:'قمر',audio:A+'w-qamar-XEKXXEXQ.mp3',opts:['شمس','قمر','كتاب']},
 {target:'بطة',audio:A+'w-batta-HFWN7BQY.mp3',opts:['أسد','فيل','بطة']},
 {target:'تفاحة',audio:A+'w-tuffaha-GZEF6Y6Z.mp3',opts:['موز','تفاحة','ليمون']}
];
var POTS=[{x:5.8,w:30.7,cx:21.1},{x:38.5,w:29.5,cx:53.3},{x:70.1,w:29.6,cx:84.6}];
var stage=document.getElementById('stage'),msg=document.getElementById('g3msg'),
    stars=document.querySelectorAll('#rounds .sb-star'),listen=document.getElementById('listen');
var round=0,lock=false,hits=[];
function play(){try{var a=new Audio(ROUNDS[round].audio);a.play().catch(function(){});}catch(e){}}
function build(){
  lock=false;msg.textContent='اضغطي على الرشاشة واسمعي الكلمة';
  hits.forEach(function(h){h.remove();});hits=[];
  [].forEach.call(stage.querySelectorAll('.fl'),function(f){f.remove();});
  ROUNDS[round].opts.forEach(function(w,i){
    var p=POTS[i],h=document.createElement('button');h.type='button';h.className='pot-hit';
    h.style.left=p.x+'%';h.style.width=p.w+'%';h.innerHTML='<span class="lab"></span>';h.firstChild.textContent=w;
    h.addEventListener('click',function(){pick(h,w,p);});stage.appendChild(h);hits.push(h);
  });
  setTimeout(play,450);
}
function pick(h,w,p){
  if(lock)return;
  if(w===ROUNDS[round].target){
    lock=true;h.classList.add('good');
    var f=document.createElement('img');f.src='assets/sb/flower.png';f.alt='';f.className='fl';f.style.left=p.cx+'%';stage.appendChild(f);
    setTimeout(function(){f.classList.add('grow');},50);
    stars[round].classList.add('on');
    msg.textContent='صح! الوردة كبرت';SB.react('ok');
    round++;
    if(round>=ROUNDS.length){
      setTimeout(function(){SB.levelUp({stars:3,text:'الحديقة كلها زهرت',next:'index.html'});},1800);
    }else setTimeout(build,1900);
  }else{
    h.classList.add('bad');msg.textContent='جربي تاني، اسمعي كويس';SB.react('no');
    setTimeout(function(){h.classList.remove('bad');},500);
  }
}
listen.addEventListener('click',play);
build();
window.__g3={click:function(good){var i=ROUNDS[round].opts.indexOf(ROUNDS[round].target);if(!good)i=(i+1)%3;hits[i].click();}};
})();
</script>
</body>
</html>
