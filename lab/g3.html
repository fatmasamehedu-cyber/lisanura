<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>حديقة الأصوات — عينة</title>
<link rel="stylesheet" href="sb.css?v=3">
<style>
  .stage{width:100%;max-width:min(520px,94vw);box-sizing:border-box;background:linear-gradient(#fffdf8cc,#fdf3dfcc);
    border:3px solid var(--sb-gold);border-radius:22px;box-shadow:0 5px 0 #d9b878,0 12px 26px #7a5a2a26;padding:16px 14px 20px}
  #listen{display:flex;align-items:center;justify-content:center;gap:10px;margin:2px auto 16px;
    border:0;border-radius:999px;background:linear-gradient(#7fb3e8,#2f6fb5);color:#fff;font-family:inherit;
    font-size:20px;font-weight:800;padding:10px 30px;cursor:pointer;box-shadow:0 4px 0 #245a8f}
  #listen:active{transform:translateY(2px);box-shadow:0 2px 0 #245a8f}
  #pots{display:flex;gap:10px;justify-content:center;align-items:flex-end;margin-top:26px}
  .pot-wrap{display:flex;flex-direction:column;align-items:center;width:23%;cursor:pointer}
  .flower{font-size:0;line-height:1;transition:font-size .6s cubic-bezier(.34,1.56,.64,1);height:64px;display:flex;align-items:flex-end}
  .pot-wrap.grown .flower{font-size:52px}
  .pot{width:100%;aspect-ratio:1/0.92;border-radius:16px 16px 22px 22px;position:relative;
    display:flex;align-items:center;justify-content:center;border:3px solid #00000018;
    box-shadow:inset 0 -10px 0 #00000014,0 4px 0 #00000022}
  .pot span{background:#fff;border-radius:50%;min-width:44px;height:44px;display:flex;align-items:center;justify-content:center;
    font-size:21px;font-weight:800;color:var(--sb-navy);box-shadow:0 2px 0 #00000022;padding:0 6px}
  .pot-wrap.bad .pot{animation:sbShk .4s}
  .pot-wrap.drops::after{content:"💧";position:absolute;font-size:22px;animation:sbDrop .7s ease-in forwards}
  @keyframes sbShk{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  @keyframes sbDrop{from{transform:translateY(-46px);opacity:1}to{transform:translateY(6px);opacity:0}}
  #g3msg{text-align:center;min-height:30px;font-size:19px;font-weight:800;color:var(--sb-pink-d);margin-top:16px}
  #rounds{display:flex;gap:8px;justify-content:center;margin-bottom:6px}
  #rounds .sb-star{width:26px;height:26px}
  .pot:nth-child(1){background:linear-gradient(#f6a8c3,#e77fa2)}
</style>
</head>
<body>
<div class="sb-page" style="background-image:url('assets/sb/bg-garden.jpg')">
  <div class="sb-topbar">
    <a class="sb-roundbtn" href="index.html" aria-label="كل العينات">🏠</a>
    <div class="sb-plaque"><h1>حديقة الأصوات</h1></div>
    <span class="sb-roundbtn" aria-hidden="true">🔊</span>
  </div>
  <p class="sb-sub">اسمعي الكلمة واسقي الأصيص الصح — الوردة هتكبر</p>
  <div class="stage">
    <div id="rounds"><div class="sb-star"></div><div class="sb-star"></div><div class="sb-star"></div></div>
    <button id="listen" type="button">🔊 اسمعي</button>
    <div id="pots"></div>
    <div id="g3msg"></div>
  </div>
</div>
<script src="sb.js?v=2"></script>
<script>
SB.teacher('full');
(function(){
"use strict";
var A='../assets/';
var ROUNDS=[
 {target:'قمر',audio:A+'w-qamar-XEKXXEXQ.mp3',opts:['قمر','شمس','كتاب','وردة']},
 {target:'بطة',audio:A+'w-batta-HFWN7BQY.mp3',opts:['أسد','بطة','فيل','حصان']},
 {target:'تفاحة',audio:A+'w-tuffaha-GZEF6Y6Z.mp3',opts:['موز','ليمون','تفاحة','رمان']}
];
var COLORS=[['#f6a8c3','#e77fa2'],['#9cc4e8','#6fa3d8'],['#f2c284','#e0a355'],['#c3a8e6','#a67fd1']];
var pots=document.getElementById('pots'),msg=document.getElementById('g3msg'),
    stars=document.querySelectorAll('#rounds .sb-star'),listen=document.getElementById('listen');
var round=0,lock=false;
function play(){try{var a=new Audio(ROUNDS[round].audio);a.play().catch(function(){});}catch(e){}}
function build(){
  lock=false;msg.textContent='';pots.innerHTML='';
  ROUNDS[round].opts.forEach(function(w,i){
    var wrap=document.createElement('div');wrap.className='pot-wrap';
    wrap.innerHTML='<div class="flower">🌸</div><div class="pot" style="background:linear-gradient('
      +COLORS[i][0]+','+COLORS[i][1]+')"><span>'+w+'</span></div>';
    wrap.addEventListener('click',function(){pick(wrap,w);});
    pots.appendChild(wrap);
  });
  setTimeout(play,450);
}
function pick(wrap,w){
  if(lock||wrap.classList.contains('grown'))return;
  if(w===ROUNDS[round].target){
    lock=true;
    wrap.classList.add('drops');
    setTimeout(function(){wrap.classList.add('grown');},350);
    stars[round].classList.add('on');
    msg.textContent='صح! الوردة كبرت';
    round++;
    if(round>=ROUNDS.length){
      setTimeout(function(){SB.levelUp({stars:3,text:'الحديقة كلها زهرت',next:'g4.html'});},1500);
    }else setTimeout(build,1600);
  }else{
    wrap.classList.add('bad');msg.textContent='جربي تاني — اسمعي كويس';
    setTimeout(function(){wrap.classList.remove('bad');},500);
  }
}
listen.addEventListener('click',play);
build();
})();
</script>
</body>
</html>
