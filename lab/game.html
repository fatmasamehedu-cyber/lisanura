<!DOCTYPE html><html lang="ar" dir="rtl"><head><!--
 LISANURA GAME - single file. HOW TO EDIT (for an AI agent or a person)
 * Questions: the object DEF (sections > levels > items). Item formats: ["mc","question",["options"],correct_index_from_0] | ["tf","statement",1 true/0 false] | ["or",[["emoji","step"],...]] | ["bd","word","emoji","english"] | ["tr","letter","name"] | ["ls",letter_index]. In-game: gear > Edit questions.
 * Characters: object AV (boy/girl poses as base64 PNG). Jump = function jump() + CSS keyframes "jump". The girl's jump uses her standing pose AV.girl.cheer (set right after AV is defined).
 * Background and top bar: CSS at the top of the style block: #bg / body.bm (site tile + arch, boy and girl versions) and "#top .rb" (white circle, rose ring, SVG icons).
 * SOUNDS: say(text) plays the clip stored under key hash(text) in the object EMB (a data: URL), otherwise looks for audio/<hash>.mp3 next to this file, otherwise uses the device voice (Web Speech). hash = FNV-1a 32-bit over the UTF-8 bytes of the trimmed text, 8 hex chars. EMB already holds letter names (ألف to دال) and the win cheer (key sfx-win). Right/wrong sounds are generated in code (function tone). To add a spoken clip: put the mp3 into EMB as "data:audio/mpeg;base64,..." under hash(text), or drop audio/<hash>.mp3 beside the file.
 * Progress is stored in localStorage key "lisa".
-->
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>لسانورا | LisaNura</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Tajawal:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{--H:min(40vh,300px);--pk:#e5788f;--dp:#d65f7a;--nv:#243a6b;--gd:#e3b341;--cr:#fff6e6;--br:#6b4226;--card:rgba(255,248,235,.95);padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
@media(prefers-color-scheme:dark){:root{--card:rgba(250,240,222,.93)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font-family:Tajawal,'Baloo 2',system-ui,sans-serif;color:var(--nv);background:#f6e3d3;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;touch-action:manipulation}
#bg{position:fixed;inset:0;background:center/cover;transition:background-image .3s}
#bg:after{content:"";position:absolute;inset:0;background:linear-gradient(#fff3,#ffe8d055)}
#top{position:fixed;top:calc(8px + env(safe-area-inset-top));left:10px;right:10px;display:flex;gap:10px;align-items:center;z-index:5;direction:ltr}
.rb{width:52px;height:52px;border-radius:50%;background:var(--cr);border:4px solid var(--gd);font-size:22px;box-shadow:0 3px 8px #0003;font-weight:800;color:var(--br)}
#lns{display:flex;gap:4px;background:var(--cr);border:3px solid var(--gd);border-radius:30px;padding:4px 12px;min-height:40px;align-items:center}#lns:empty{display:none}
.ln{font-size:22px;filter:grayscale(1) opacity(.4)}.ln.on{filter:none;animation:pop .4s}
.sp{flex:1}
main{position:absolute;inset:70px 0 0;display:flex;align-items:center;justify-content:center;padding:8px 8px 8px min(26vw,240px);overflow:auto}
.card,.hub{width:min(100%,700px);margin:auto}
.card{background:var(--card);border:4px solid var(--gd);border-radius:28px;padding:16px;text-align:center;box-shadow:0 8px 24px #0004}
h2{margin:0 0 10px;font-size:clamp(17px,3.2vw,22px);background:#fde4e4;border-radius:16px;padding:8px 12px}
#ch{position:fixed;left:0;bottom:0;height:calc(var(--H)*var(--k,1));max-width:44vw;object-fit:contain;object-position:left bottom;pointer-events:none;z-index:3;animation:bob 2.4s ease-in-out infinite;transform-origin:bottom}
#ch.jp{animation:jump .7s cubic-bezier(.3,.7,.4,1)}

.hub{text-align:center}.hub h1{margin:0;font-size:clamp(30px,6vw,46px);color:var(--dp);text-shadow:0 2px 0 #fff,0 4px 10px #0003}.hub h1 small{font-family:'Baloo 2';color:var(--nv);font-size:.5em}
.hub p{margin:4px 0 12px;font-weight:800;background:var(--card);display:inline-block;padding:4px 16px;border-radius:20px}
.map{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 14px}
.isl{background:none;width:104px;display:flex;flex-direction:column;align-items:center;transform:translateY(var(--o));font-weight:800;text-shadow:0 1px 0 #fff}
.ci{width:82px;height:82px;border-radius:50% 50% 46% 46%;background:radial-gradient(circle at 35% 30%,#fff8e0,#f5cf7a);border:4px solid #fff;box-shadow:0 8px 0 #9bbf6a,0 10px 14px #0004;display:grid;place-items:center;font-size:38px;transition:transform .2s}
.isl:active .ci{transform:scale(.92)}.isl b{margin-top:12px;font-size:14px;background:var(--cr);padding:2px 10px;border-radius:12px;border:2px solid var(--gd)}.isl em{font-style:normal;color:var(--gd);font-size:18px;letter-spacing:2px;text-shadow:0 1px 2px #0006}
.lk{filter:grayscale(.9) opacity(.75)}

.cw{position:relative;width:min(300px,70vw);aspect-ratio:1;margin:auto;background:#fffaf0;border:6px solid var(--gd);border-radius:26px}
.cw canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.pots,.gems,.opts,.tfb,.cds,.br,.trn{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:10px 0;direction:rtl}
.pot{width:80px;background:none;position:relative}.pot i{font-style:normal;font-size:44px;display:block;height:54px;transition:transform .4s}.pot.gr i{transform:scale(1.5)}
.pot b{display:block;background:var(--pk);border-radius:6px 6px 18px 18px;padding:8px 0;font-size:32px;color:var(--nv)}.pot:nth-child(2) b{background:#8fa8d0}.pot:nth-child(3) b{background:#f2b45e}
.pic{font-size:64px}.pic small{display:block;font:800 18px 'Baloo 2'}
.out{font-size:48px;font-weight:800;color:var(--br);min-height:70px}
.gem{width:68px;height:68px;font-size:34px;font-weight:800;color:var(--nv);background:linear-gradient(135deg,#fff8,#f4a6c0);clip-path:polygon(50% 0,95% 25%,95% 75%,50% 100%,5% 75%,5% 25%);transition:opacity .3s}.gem:nth-child(2n){background:linear-gradient(135deg,#fff8,#9fc0ee)}.gem:nth-child(3n){background:linear-gradient(135deg,#fff8,#c9a8ee)}.gem:disabled{opacity:.25}
.pl2,.plank{background:linear-gradient(#f9d392,#e1a95d);border:3px solid #b57a3a;border-radius:12px;padding:10px 18px;font-size:clamp(20px,5vw,28px);font-weight:800;color:var(--br);box-shadow:0 4px 0 #9a6a30;min-width:70px}
.bl{background:#0001;border-style:dashed;box-shadow:none;color:transparent}.bl.f{color:var(--br);background:#c8efb0}
.br{background:#8a5a2b33;border-radius:16px;padding:10px;flex-wrap:nowrap;overflow-x:auto;justify-content:center}
.vs{font-size:clamp(24px,6vw,34px);line-height:2;font-weight:500}mark{background:#ffd0dc;border-radius:8px;padding:0 6px}
.st{font-size:clamp(22px,5vw,30px);font-weight:800;background:#fde4e4;border-radius:20px;padding:16px;margin:8px 0}.st small{display:block;font:600 16px 'Baloo 2';opacity:.8}

.wg{width:70px;height:70px;background:linear-gradient(#f28aa3,#d65f7a);border-radius:10px 10px 4px 4px;border-bottom:8px solid var(--gd);display:grid;place-items:center}.wg i{width:54px;height:54px;border:2px dashed #fff9;border-radius:10px;display:grid;place-items:center;color:#fff;font:800 22px 'Baloo 2';font-style:normal}
.cd{background:#fffaf0;border:3px solid #e8d2a8;border-radius:14px;padding:8px 10px;min-width:84px}.cd b{display:block;font-size:34px}.cd small{font-weight:800;font-size:13px}
.sh{animation:sh .4s}
#rw{position:fixed;inset:0;z-index:10;background:center/cover;display:flex;align-items:flex-end;justify-content:center;padding-bottom:calc(14px + env(safe-area-inset-bottom))}#rw[hidden]{display:none}
#rwc{background:var(--card);border:4px solid var(--gd);border-radius:26px;padding:10px 20px;text-align:center;max-width:94vw}#rwc h2{background:none;margin:0}
.big{font-size:clamp(34px,8vw,52px);letter-spacing:4px}.big span{opacity:.3}
@keyframes bob{50%{transform:translateY(-6px) rotate(1deg)}}@keyframes jump{0%{transform:scale(1.06,.9)}25%{transform:translateY(-46px) scale(.96,1.06) rotate(-3deg)}55%{transform:translateY(-12px) scale(1,1) rotate(2deg)}80%{transform:scale(1.07,.9)}100%{transform:none}}
@keyframes pop{50%{transform:scale(1.5)}}@keyframes bb{0%{opacity:0;transform:translateY(10px)}30%{opacity:1}100%{opacity:0;transform:translateY(-30px)}}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@media(max-width:700px){:root{--H:19vh}#bub{bottom:17vh;left:14vw}main{padding:8px 8px 21vh}}
@media(max-height:520px){:root{--H:36vh}#bub{bottom:34vh}main{padding:4px 4px 4px 26vh}.pic{font-size:44px}.out{font-size:36px;min-height:48px}.cw{width:min(210px,40vh)}}
#md{position:fixed;inset:0;z-index:12;background:#0006;display:grid;place-items:center;padding:12px;overflow:auto}#md[hidden]{display:none}

.hn{animation:hn .5s 3}@keyframes hn{50%{opacity:.45;filter:drop-shadow(0 0 8px #e3b341);transform:scale(1.08)}}
.cf{position:fixed;top:-30px;z-index:11;pointer-events:none;animation:fall 2.4s linear forwards;font-style:normal}@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
#rw.nh{flex-direction:column;justify-content:center;align-items:center;gap:6px;padding:10px}#rwx{text-align:center}.rwa{display:block;margin:8px auto;height:min(34vh,260px);animation:bob 2.4s ease-in-out infinite}
.rib{display:inline-block;background:var(--pk);color:#fff;font:800 clamp(26px,6vw,42px) 'Baloo 2',Tajawal,sans-serif;padding:4px 36px;border:4px solid var(--gd);border-radius:14px;box-shadow:0 5px 0 var(--dp)}
.mzr{position:relative;width:min(300px,64vw);margin:auto}#mzs{width:100%;display:block;background:#fffaf0;border:5px solid var(--gd);border-radius:22px}.pv{position:absolute;top:8px;left:8px;width:58px;background:#fffc;border-radius:10px;border:2px solid var(--gd);z-index:1}
.pal{display:flex;gap:14px;justify-content:center;margin:10px}.sw{width:54px;height:54px;border-radius:50%;border:4px solid #fff;box-shadow:0 3px 6px #0004}.sw.on{box-shadow:0 0 0 4px var(--nv),0 3px 6px #0004}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}
.secs{display:flex;flex-direction:column;gap:12px;align-items:center}
.sc{width:min(100%,380px);display:flex;align-items:center;gap:14px;padding:12px 18px;border-radius:26px;background:var(--card);border:4px solid var(--gd);box-shadow:0 6px 0 #b88a3a,0 10px 16px #0003;font-weight:800;font-size:clamp(18px,4.6vw,24px);text-align:start;color:var(--nv)}
.sc .ci{width:62px;height:62px;font-size:30px;flex:none;box-shadow:0 4px 0 #9bbf6a}.sc em{margin-inline-start:auto;font-style:normal;color:#c9961a;font-size:.8em}
.s-q{border-color:#6bbf9a}.s-i{border-color:#e3b341}.s-a{border-color:#e5788f}
#ta{width:100%;height:40vh;font:12px/1.4 ui-monospace,Menlo,monospace;border:3px solid var(--gd);border-radius:12px;padding:8px;text-align:left}
.hint{font-size:13px;margin:4px 0;text-align:start}#em{min-height:22px;font-weight:800;margin:4px 0}
.plank{max-width:100%;white-space:normal;line-height:1.5}
