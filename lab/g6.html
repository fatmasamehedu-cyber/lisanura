<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مرجل الحروف — عينة</title>
<link rel="stylesheet" href="sb.css?v=4">
<style>
  :root{--w:min(94vw,520px)}
  .stage{position:relative;width:var(--w);aspect-ratio:680/820;border-radius:20px;overflow:hidden;border:4px solid #fff;
    box-shadow:0 6px 0 #d9b878,0 14px 28px #4a2d0a40;background:radial-gradient(ellipse at 50% 70%,#ffe9a8 0,#f3d49b 35%,#d9b48a 100%)}
  .pot{position:absolute;left:0;bottom:0;width:100%;display:block;
    -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 16%);mask-image:linear-gradient(to bottom,transparent 0,#000 16%)}
  .slots{position:absolute;top:3%;left:50%;transform:translateX(-50%);display:flex;flex-direction:row-reverse;gap:2.5%;padding:2% 4%;
    background:#fff8e8e6;border-radius:999px;box-shadow:0 3px 0 #c9a15c;white-space:nowrap}
  .slot{width:calc(var(--w)*.1);height:calc(var(--w)*.1);border-radius:12px;border:2px dashed #c9a15c;display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:calc(var(--w)*.07);color:#8a4b12;background:#fffdf6}
  .slot.on{border-style:solid;background:#ffe9a0}
  .gem{position:absolute;top:22%;width:23%;aspect-ratio:1/1.05;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent;
    clip-path:polygon(50% 0,95% 24%,95% 76%,50% 100%,5% 76%,5% 24%);font-family:inherit;font-weight:800;font-size:calc(var(--w)*.1);color:#3b1e5e;
    animation:fl 2.6s ease-in-out infinite;transition:transform .7s ease-in,opacity .7s}
  .gem:nth-child(3n+1){background:linear-gradient(#ffd0e1,#f08fb3)}
  .gem:nth-child(3n+2){background:linear-gradient(#cfe6ff,#6aa0e0)}
  .gem:nth-child(3n){background:linear-gradient(#e3d0ff,#a67fe0)}
  .gem.bad{animation:shk .4s}
  .gem.fly{transform:translate(var(--dx),calc(var(--w)*.62)) scale(.3);opacity:0;animation:none}
  @keyframes fl{50%{margin-top:-14px}}
  @keyframes shk{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
  .spk{position:absolute;top:3%;right:3%;width:calc(var(--w)*.13);height:calc(var(--w)*.13);border-radius:50%;border:3px solid #fff;background:#f4a0bb;
    font-size:calc(var(--w)*.07);cursor:pointer;box-shadow:0 3px 0 #b8607f;padding:0}
  .spk.pulse{animation:cp 1.2s ease-in-out 3}
  @keyframes cp{50%{box-shadow:0 0 0 6px #ffffffaa,0 0 24px 10px #ffe48f}}
  .spark{position:absolute;pointer-events:none;font-size:calc(var(--w)*.06);animation:up 1.1s ease-out forwards}
  @keyframes up{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-90px)}}
  .done{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);font-weight:800;font-size:calc(var(--w)*.17);color:#8a4b12;
    text-shadow:0 0 18px #fff3b0,0 0 30px #ffd45c;opacity:0;transition:opacity .4s}
  .done.show{opacity:1}
  #g6msg{text-align:center;min-height:26px;font-size:18px;font-weight:800;color:var(--sb-pink-d);margin-top:8px;background:#fff6e9e6;border-radius:12px;padding:2px 14px}
  #rounds{display:flex;gap:8px;justify-content:center;margin:8px 0 0}
  #rounds .sb-star{width:26px;height:26px}
  .sb-teacher{height:min(16vh,140px)!important}
</style>
</head>
<body>
<div class="sb-page" style="background:linear-gradient(#f9e6c4,#f1d3a0)">
  <div class="sb-topbar">
    <a class="sb-roundbtn" href="index.html" aria-label="كل العينات">🏠</a>
    <div class="sb-plaque"><h1>مرجل الحروف</h1></div>
    <span class="sb-roundbtn" aria-hidden="true" style="visibility:hidden"></span>
  </div>
  <div class="stage" id="stage">
    <img class="pot" src="assets/sb/cauldron3.jpg" alt="">
    <div class="slots" id="slots"></div>
    <button class="spk pulse" id="listen" type="button" aria-label="اسمعي">🔊</button>
    <div class="done" id="done"></div>
  </div>
  <div id="rounds"><div class="sb-star"></div><div class="sb-star"></div><div class="sb-star"></div></div>
  <div id="g6msg"></div>
</div>
<script src="sb.js?v=4"></script>
<script>
SB.teacher('full');
(function(){
"use strict";
var WORDS=[
 {ar:'قمر',letters:['ق','م','ر'],audio:'../assets/w-qamar-XEKXXEXQ.mp3'},
 {ar:'بطة',letters:['ب','ط','ة'],audio:'../assets/w-batta-HFWN7BQY.mp3'},
 {ar:'نجمة',letters:['ن','ج','م','ة'],audio:'../assets/w-najma-4S4O7DC5.mp3'}
];
var POOL='ب ت ج ح د ر س ش ص ع ف ق ك ل م ن ه و ي'.split(' ');
var stage=document.getElementById('stage'),slots=document.getElementById('slots'),msg=document.getElementById('g6msg'),
    done=document.getElementById('done'),stars=document.querySelectorAll('#rounds .sb-star'),cheer=new Audio('../assets/cheer.mp3');
var wi=0,li=0,lock=false,gems=[],aud=null;
function W(){return WORDS[wi];}
function play(){try{if(aud)aud.pause();aud=new Audio(W().audio);aud.play().catch(function(){});}catch(e){}}
document.getElementById('listen').addEventListener('click',play);
function drawSlots(){
  slots.innerHTML='';
  W().letters.forEach(function(c,k){var s=document.createElement('div');s.className='slot'+(k<li?' on':'');s.textContent=k<li?c:'';slots.appendChild(s);});
}
function spark(x,y){for(var i=0;i<5;i++){var s=document.createElement('div');s.className='spark';s.textContent='✨';
  s.style.left=(x+(Math.random()*30-15))+'%';s.style.top=y+'%';s.style.animationDelay=(i*.08)+'s';stage.appendChild(s);setTimeout(function(){s.remove();},1500);}}
function newGems(){
  lock=false;gems.forEach(function(g){g.remove();});gems=[];
  var need=W().letters[li],set=[need];
  while(set.length<3){var c=POOL[Math.floor(Math.random()*POOL.length)];if(set.indexOf(c)<0&&c!==need)set.push(c);}
  for(var i=2;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=set[i];set[i]=set[j];set[j]=t;}
  var xs=[5,38.5,72];
  set.forEach(function(ch,k){
    var g=document.createElement('button');g.type='button';g.className='gem';g.textContent=ch;
    g.style.left=xs[k]+'%';g.style.animationDelay=(k*.4)+'s';
    g.style.setProperty('--dx',((50-xs[k]-11.5)/100*stage.clientWidth)+'px');
    g.addEventListener('click',function(){pick(g,ch,xs[k]);});
    stage.appendChild(g);gems.push(g);
  });
}
function pick(g,ch,x){
  if(lock)return;
  if(ch!==W().letters[li]){g.classList.add('bad');setTimeout(function(){g.classList.remove('bad');},450);msg.textContent='جربي حرف تاني';SB.react('no');return;}
  lock=true;g.classList.add('fly');SB.react('ok');msg.textContent='صح!';
  setTimeout(function(){
    li++;spark(50,52);drawSlots();
    if(li>=W().letters.length){
      done.textContent=W().ar;done.classList.add('show');
      try{cheer.currentTime=0;cheer.play().catch(function(){});}catch(e){}
      stars[wi].classList.add('on');msg.textContent='أحسنتي! '+W().ar+' كاملة';
      wi++;
      gems.forEach(function(q){q.remove();});gems=[];
      if(wi>=WORDS.length){setTimeout(function(){SB.levelUp({stars:3,text:'خلصتي كل كلمات المرجل',next:'g7.html'});},1500);}
      else setTimeout(function(){done.classList.remove('show');li=0;drawSlots();newGems();play();msg.textContent='';},1600);
    }else newGems();
  },720);
}
msg.textContent='اضغطي على الصوت واسمعي الكلمة، ورتبي الحروف';
drawSlots();newGems();
window.__g6={click:function(good){var need=W().letters[li];var t=gems.filter(function(g){return (g.textContent===need)===good;})[0];t.click();}};
})();
</script>
</body>
</html>
