<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مين هيلعب؟</title>
<link rel="stylesheet" href="sb.css?v=2">
<style>
.pick{display:flex;gap:14px;justify-content:center;width:100%;max-width:520px;margin-top:10px}
.card{flex:1;max-width:240px;border:4px solid var(--sb-gold);border-radius:24px;background:linear-gradient(#fffdf8,#fdf3df);
 box-shadow:0 6px 0 #d9b878,0 14px 26px #7a5a2a33;padding:10px 8px 14px;text-align:center;cursor:pointer;font-family:inherit;color:var(--sb-navy)}
.card:active{transform:translateY(3px)}
.card img{display:block;margin:0 auto;height:min(40vh,300px);width:auto;max-width:100%;object-fit:contain}
.card b{display:block;font-size:24px;margin-top:8px}
.boy{background:linear-gradient(#eef6ff,#d9e9fb);border-color:#6fa3d8}
.girl{background:linear-gradient(#fff1f6,#fbdbe7);border-color:#e77fa2}
</style>
</head>
<body>
<div class="sb-page" style="background-image:url('assets/sb/bg-map.jpg')">
  <div class="sb-topbar"><span class="sb-roundbtn" style="visibility:hidden"></span><div class="sb-plaque"><h1>مين هيلعب؟</h1></div><span class="sb-roundbtn" style="visibility:hidden"></span></div>
  <p class="sb-sub">اختاري شخصيتك وهتلعبي بيها في كل الألعاب</p>
  <div class="pick">
    <button class="card boy" id="b" type="button"><img src="assets/chars/boy.png" alt=""><b>ولد</b></button>
    <button class="card girl" id="g" type="button"><img src="assets/chars/girl.png" alt=""><b>بنت</b></button>
  </div>
</div>
<script src="sb.js?v=5"></script>
<script>
function go(g){SB.profile.setGender(g);location.href='index.html';}
document.getElementById('b').onclick=function(){go('boy');};
document.getElementById('g').onclick=function(){go('girl');};
</script>
</body>
</html>
