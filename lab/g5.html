<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>قطار القصة — عينة</title>

<link rel="stylesheet" href="sb.css">
<style>
  #trainRow{display:flex;gap:10px;justify-content:center;margin:10px 0 4px;direction:ltr;transition:transform 1.6s ease-in}
  .car{width:104px;min-height:92px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
    padding:8px 6px;font-size:13.5px;color:#8a7458;cursor:pointer;position:relative}
  .car .num{font-weight:800;color:var(--sb-gold-d);font-size:18px}
  .car .wheels{font-size:12px;letter-spacing:4px;margin-top:auto;color:#5d3a17}
  .car.full{border-style:solid;border-color:var(--sb-pink-d);color:var(--sb-ink);font-weight:800;background:linear-gradient(#fffdf8,#fdeedd)}
  .car.good{border-color:var(--sb-green-d)}
  .car.bad{border-color:var(--sb-red-d);animation:sbShk .4s}
  @keyframes sbShk{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  #pool{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
  .t-card{padding:12px 8px;font-size:17px;cursor:pointer;transition:transform .15s}
  .t-card.sel{border-color:var(--sb-navy);background:linear-gradient(#fff,#eaf3fb);transform:scale(1.05)}
  #g5msg{text-align:center;min-height:32px;font-size:19px;font-weight:800;color:var(--sb-pink-d);margin-top:12px}
  #g5go{display:block;margin:6px auto 0}
  .stage{background:linear-gradient(#fffdf8cc,#fdf3dfcc);border:3px solid var(--sb-gold);border-radius:22px;
    box-shadow:0 5px 0 #d9b878,0 12px 26px #7a5a2a26;padding:14px;box-sizing:border-box}
</style>
</head>
<body>
<div class="sb-page" style="background-image:url('assets/sb/bg-train.jpg')">
  <div class="sb-topbar">
    <a class="sb-roundbtn" href="index.html" aria-label="كل العينات">🏠</a>
    <div class="sb-plaque"><h1>قطار القصة</h1></div>
    <span class="sb-roundbtn" aria-hidden="true">🔊</span>
  </div>
  <p class="sb-sub">دوسي على الكارت وبعدين على العربية المناسبة — رتبي أحداث اليوم من ١ ل٤ والقطر هيمشي</p>
  <div class="stage">
    <div id="trainRow"></div>
    <div id="g5msg"></div>
    <div id="pool"></div>
    <button id="g5go" class="sb-pill" type="button" disabled>شغلي القطر</button>
  </div>
</div>
<script src="sb.js"></script>
<script>
SB.teacher('point');
(function(){
"use strict";
var EVENTS=['صحيت من النوم','غسلت وشي وإيدي','كلت الفطار','لبست هدومي'];
var pool=document.getElementById('pool'),train=document.getElementById('trainRow'),
    msg=document.getElementById('g5msg'),go=document.getElementById('g5go');
var order=[2,0,3,1];
var sel=null,cars=[null,null,null,null],moving=false;
function build(){
  pool.innerHTML='';train.innerHTML='';msg.textContent='';cars=[null,null,null,null];sel=null;moving=false;
  train.style.transform='';
  order.forEach(function(ei){
    var c=document.createElement('button');
    c.className='sb-plank t-card';c.type='button';c.textContent=EVENTS[ei];
    c.addEventListener('click',function(){
      if(moving)return;
      if(sel===c){c.classList.remove('sel');sel=null;return;}
      if(sel)sel.classList.remove('sel');
      sel=c;c.classList.add('sel');
    });
    pool.appendChild(c);
  });
  for(var i=0;i<4;i++)(function(i){
    var car=document.createElement('div');
    car.className='sb-slot car';
    car.innerHTML='<span class="num">'+(i+1)+'</span><span class="wheels">● ●</span>';
    car.addEventListener('click',function(){
      if(moving||!sel)return;
      var old=cars.indexOf(sel);
      if(old>=0){cars[old]=null;drawCar(old);}
      cars[i]=sel;drawCar(i);
      sel.classList.remove('sel');sel=null;
      check();
    });
    train.appendChild(car);
  })(i);
  go.disabled=true;
}
function drawCar(i){
  var car=train.children[i];
  var c=cars[i];
  if(c){
    car.classList.add('full');car.classList.remove('good','bad');
    car.innerHTML='<span class="num">'+(i+1)+'</span><span>'+c.textContent+'</span><span class="wheels">● ●</span>';
  }else{
    car.classList.remove('full','good','bad');
    car.innerHTML='<span class="num">'+(i+1)+'</span><span class="wheels">● ●</span>';
  }
}
function check(){go.disabled=cars.some(function(c){return !c;});}
go.addEventListener('click',function(){
  var ok=true;
  for(var i=0;i<4;i++){
    var car=train.children[i];
    var idx=[...pool.children].indexOf(cars[i]);
    var evI=order[idx];
    if(evI===i){car.classList.add('good');}else{car.classList.add('bad');ok=false;}
  }
  if(ok){
    moving=true;msg.textContent='صح! القطر ماشي';
    SB.cheer();
    train.style.transform='translateX(-130%)';
    setTimeout(function(){
      SB.levelUp({stars:3,text:'رتبتي أحداث اليوم صح',next:'g6.html'});
    },1500);
    go.disabled=true;
  }else{
    msg.textContent='لسه — بصي على العربيات اللي بتهتز';
    setTimeout(function(){
      for(var i=0;i<4;i++){
        var car=train.children[i];
        if(car.classList.contains('bad')){
          cars[i].classList.remove('sel');
          cars[i]=null;drawCar(i);
        }
      }
      go.disabled=true;
    },900);
  }
});
build();
})();
</script>
</body>
</html>
