<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>فوانيس الدرب — عينة</title>
<link rel="stylesheet" href="lab.css">
<style>
  .px-wrap{position:relative}
  #pxc{image-rendering:pixelated;image-rendering:crisp-edges}
  .lane-btns{display:flex;gap:10px;justify-content:center;margin-top:12px}
  .lane-btns button{
    width:76px;height:56px;border-radius:16px;border:2px solid #c16a7e;background:#fff;
    font-size:26px;color:#7e4150;font-family:inherit;font-weight:700;cursor:pointer;
  }
  .lane-btns button:active{background:#f7e3ea;transform:scale(.94)}
  #bigStart{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:#232a4ae0;border-radius:18px;color:#fff;cursor:pointer;border:0;
    font-family:inherit;font-size:26px;font-weight:700;flex-direction:column;gap:8px;
  }
  #bigStart small{font-size:15px;color:#f5c15c;font-weight:400}
</style>
</head>
<body>
<div class="lab-wrap">
  <div class="lab-top">
    <a class="lab-back" href="index.html">‹ كل العينات</a>
    <span class="lab-badge">عينة ٨ — شخصية البكسل</span>
  </div>
  <h1 class="lab-title">فوانيس الدرب</h1>
  <p class="lab-sub">اسمعي الكلمة، وتحركي فوق وتحت لتجمع المعلمة حروفها من الفوانيس بالترتيب</p>
  <div class="game-frame">
    <div class="px-wrap">
      <canvas id="pxc" class="game" width="480" height="270"></canvas>
      <button id="bigStart" type="button">ابدئي اللعب<small>المسي نص الشاشة فوق وتحت، أو استخدمي الزرارين</small></button>
    </div>
    <div class="lane-btns">
      <button id="btnUp" type="button" aria-label="فوق">▲</button>
      <button id="btnDn" type="button" aria-label="تحت">▼</button>
    </div>
    <p class="game-note">الفانوس الصح يديك نجمة، والغلط بيطير بس من غير ما يخسرك. خلصي الكلمات الثلاث!</p>
  </div>
</div>
<script>
(function(){
"use strict";
var cv=document.getElementById('pxc'),ctx=cv.getContext('2d');
ctx.imageSmoothingEnabled=false;
var W=480,H=270;
var LANES=[96,150,204];
var WORDS=[
 {ar:'قمر',  letters:['ق','م','ر'], audio:'../assets/w-qamar-DVXILJUU.mp3'},
 {ar:'شمس',  letters:['ش','م','س'], audio:'../assets/w-shams-A5G7S7M3.mp3'},
 {ar:'كتاب', letters:['ك','ت','ا','ب'], audio:'../assets/w-kitab-RKNULSGA.mp3'}
];
var POOL='ب ت ج ح خ د ر س ش ص ط ع ف ق ك ل م ن ه و ي'.split(' ');
var teacher=new Image(); teacher.src='assets/px-teacher.png';
var bgImg=new Image(); bgImg.src='assets/px-bg.png';
var cheer=new Audio('../assets/cheer.mp3');
var S={running:false,wi:0,li:0,lane:1,frame:0,ft:0,scroll:0,lant:[],spawnT:0,stars:0,
       parts:[],shake:0,msg:'',msgT:0,done:false,aud:null};
function playWord(){
  try{
    if(S.aud){S.aud.pause();}
    S.aud=new Audio(WORDS[S.wi].audio); S.aud.play().catch(function(){});
  }catch(e){}
}
function needed(){ return WORDS[S.wi].letters[S.li]; }
function spawn(){
  var lane=Math.floor(Math.random()*3);
  var ch;
  if(Math.random()<0.55){ ch=needed(); lane=Math.floor(Math.random()*3); }
  else{
    do{ ch=POOL[Math.floor(Math.random()*POOL.length)]; }while(ch===needed());
  }
  S.lant.push({x:W+30,lane:lane,ch:ch,got:false});
}
function burst(x,y,col){
  for(var i=0;i<14;i++){
    var a=Math.random()*Math.PI*2,s=1+Math.random()*2.4;
    S.parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,t:0,col:col});
  }
}
function step(){
  if(!S.running)return;
  S.scroll+=1.6;
  S.ft++; if(S.ft%8===0)S.frame=(S.frame+1)%4;
  S.spawnT--;
  if(S.spawnT<=0){ spawn(); S.spawnT=55+Math.floor(Math.random()*40); }
  var tx=120, ty=LANES[S.lane];
  for(var i=S.lant.length-1;i>=0;i--){
    var L=S.lant[i]; L.x-=1.6;
    if(!L.got && Math.abs(L.x-tx)<26 && L.lane===S.lane){
      L.got=true;
      if(L.ch===needed()){
        S.stars++; burst(tx,ty-24,'#f5c15c');
        S.li++;
        if(S.li>=WORDS[S.wi].letters.length){
          S.msg='أحسنت! كلمة '+WORDS[S.wi].ar+' كاملة'; S.msgT=90;
          try{cheer.currentTime=0;cheer.play().catch(function(){});}catch(e){}
          S.wi++;
          if(S.wi>=WORDS.length){ S.done=true; S.running=false; showWin(); return; }
          S.li=0; playWord();
        }
      }else{
        burst(L.x,LANES[L.lane]-20,'#c7b7d9'); S.shake=6;
      }
    }
    if(L.x<-40||L.got)S.lant.splice(i,1);
  }
  if(S.msgT>0)S.msgT--;
  if(S.shake>0)S.shake--;
  for(var j=S.parts.length-1;j>=0;j--){
    var p=S.parts[j]; p.x+=p.vx; p.y+=p.vy; p.vy+=0.08; p.t++;
    if(p.t>40)S.parts.splice(j,1);
  }
}
function drawLantern(x,y,ch,scale){
  ctx.save(); ctx.translate(x,y); ctx.scale(scale,scale);
  ctx.strokeStyle='#d9a44f'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(0,-26); ctx.lineTo(0,-20); ctx.stroke();
  ctx.fillStyle='#f5c15c';
  ctx.beginPath(); ctx.ellipse(0,-4,13,17,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#e8b04a';
  ctx.fillRect(-13,-8,26,3); ctx.fillRect(-13,1,26,3);
  ctx.fillStyle='#d9a44f';
  ctx.beginPath(); ctx.ellipse(0,13,6,3,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#8e2f47';
  ctx.font='bold 20px "Noto Naskh Arabic",serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(ch,0,-4);
  ctx.restore();
}
function draw(){
  ctx.save();
  if(S.shake>0)ctx.translate((Math.random()-.5)*S.shake,(Math.random()-.5)*S.shake);
  var off=-(S.scroll%96);
  for(var x=off;x<W;x+=96)ctx.drawImage(bgImg,0,0,96,54,x,0,96,270);
  var w=WORDS[S.wi]||WORDS[WORDS.length-1];
  if(S.running||S.done){
    ctx.fillStyle='#232a4acc'; ctx.fillRect(8,6,W-16,34);
    ctx.fillStyle='#fff'; ctx.font='bold 17px "Noto Naskh Arabic",serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('الكلمة: '+w.ar,W/2-60,23);
    ctx.font='bold 20px "Noto Naskh Arabic",serif';
    for(var li=0;li<w.letters.length;li++){
      ctx.fillStyle=li<S.li?'#f5c15c':'#8a94c9';
      ctx.fillText(w.letters[li],W/2+80-li*24,23);
    }
    ctx.textAlign='left'; ctx.fillStyle='#f5c15c'; ctx.font='bold 16px "Noto Naskh Arabic",serif';
    ctx.fillText('★ '+S.stars,16,23);
    ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,.55)';ctx.font='13px "Noto Naskh Arabic",serif';
    ctx.fillText('اسمعي الكلمة',W-70,23);
  }
  for(var i=0;i<S.lant.length;i++){
    var L=S.lant[i];
    drawLantern(L.x,LANES[L.lane],L.ch,1);
  }
  var ty=LANES[S.lane];
  ctx.save();
  ctx.beginPath(); ctx.ellipse(120,ty+16,26,5,0,0,Math.PI*2);
  ctx.fillStyle='rgba(0,0,0,.25)'; ctx.fill();
  ctx.drawImage(teacher,S.frame*40,0,40,39,120-33,ty-62,66,64);
  ctx.restore();
  for(var j=0;j<S.parts.length;j++){
    var p=S.parts[j]; ctx.fillStyle=p.col;
    ctx.fillRect(p.x-2,p.y-2,4,4);
  }
  if(S.msgT>0){
    ctx.fillStyle='#232a4add'; ctx.fillRect(40,110,W-80,48);
    ctx.fillStyle='#f5c15c'; ctx.font='bold 22px "Noto Naskh Arabic",serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(S.msg,W/2,134);
  }
  ctx.restore();
}
function loop(){ step(); draw(); requestAnimationFrame(loop); }
function up(){ if(S.running&&S.lane>0)S.lane--; }
function dn(){ if(S.running&&S.lane<2)S.lane++; }
document.getElementById('btnUp').addEventListener('click',up);
document.getElementById('btnDn').addEventListener('click',dn);
var tY=null;
cv.addEventListener('touchstart',function(e){tY=e.touches[0].clientY;},{passive:true});
cv.addEventListener('touchend',function(e){
  if(tY===null)return;
  var dy=e.changedTouches[0].clientY-tY;
  if(dy<-18)up(); else if(dy>18)dn();
  else{ var r=cv.getBoundingClientRect(); var y=(e.changedTouches[0].clientY-r.top)/r.height;
        if(y<0.5)up(); else dn(); }
  tY=null;
});
document.addEventListener('keydown',function(e){
  if(e.key==='ArrowUp')up(); if(e.key==='ArrowDown')dn();
});
var startBtn=document.getElementById('bigStart');
startBtn.addEventListener('click',function(){
  startBtn.style.display='none';
  S.running=true; S.wi=0; S.li=0; S.stars=0; S.lant=[]; S.done=false;
  playWord();
});
function showWin(){
  startBtn.style.display='flex';
  startBtn.innerHTML='برافو! خلصتي كل الكلمات ★★★<small>دوسي للعب تاني</small>';
}
loop();
})();
</script>
</body>
</html>
