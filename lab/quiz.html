<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quiz sample</title>
<link rel="stylesheet" href="sb.css?v=3">
<style>
.book{width:100%;max-width:min(520px,94vw);box-sizing:border-box;background:#fffdf8;border:4px solid #c98f4f;border-radius:20px;
  box-shadow:0 6px 0 #a8743a,0 14px 28px #5d3c1540;padding:12px}
.book img{display:block;width:100%;height:min(20vh,160px);object-fit:cover;border-radius:12px;border:2px solid #e8c07a}
.tag{display:inline-block;background:#e58aa8;color:#fff;font-weight:800;font-size:13px;border-radius:99px;padding:3px 12px;margin:10px 0 0}
#q{font-size:20px;font-weight:800;color:var(--sb-navy);text-align:center;margin:8px 6px 4px;min-height:84px;display:flex;align-items:center;justify-content:center;line-height:1.35}
#fb{min-height:24px;text-align:center;font-size:17px;font-weight:800}
#opts{display:flex;flex-direction:column;gap:10px;margin-top:12px;width:100%;max-width:min(520px,94vw)}
#opts .sb-pill{font-size:19px;padding:12px 10px;width:100%}
#opts .sb-pill.ok{background:#3f9d58;color:#fff}
#opts .sb-pill.no{background:#c04747;color:#fff}
#rounds{display:flex;gap:5px;justify-content:center;margin:2px 0 4px}
#rounds .sb-star{width:20px;height:20px}
.sb-teacher{height:min(20vh,170px)!important}
</style>
</head>
<body>
<div class="sb-page" style="background:#fff3dc">
  <div class="sb-topbar">
    <a class="sb-roundbtn" href="index.html" aria-label="All samples">🏠</a>
    <div class="sb-plaque"><h1 id="ttl">Quiz</h1></div>
    <span class="sb-roundbtn" style="visibility:hidden"></span>
  </div>
  <div class="book">
    <div id="rounds"></div>
    <img id="art" src="assets/sb/bg-board.jpg" alt="">
    <div style="text-align:center"><span class="tag" id="tag"></span></div>
    <div id="q" dir="auto"></div>
    <div id="fb"></div>
  </div>
  <div id="opts"></div>
</div>
<script src="sb.js?v=2"></script>
<script src="banks/tajweed.js?v=1"></script>
<script>
SB.teacher('full');
(function(){
"use strict";
var key=(location.search.match(/b=(\w+)/)||[0,'tajweed'])[1];
var bank=window.SB_BANKS[key]||window.SB_BANKS.tajweed;
document.getElementById('ttl').textContent=bank.title;document.title=bank.title;
document.getElementById('tag').textContent=bank.tag;
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
var N=8,Q=shuf(bank.items).slice(0,N).map(function(it){return{q:it.q,c:it.o[0],o:shuf(it.o)};});
var i=0,score=0,lock=false;
var qE=document.getElementById('q'),fb=document.getElementById('fb'),rs=document.getElementById('rounds'),oe=document.getElementById('opts');
Q.forEach(function(){var s=document.createElement('div');s.className='sb-star';rs.appendChild(s);});
function show(){
  qE.textContent=Q[i].q;fb.textContent='';lock=false;oe.innerHTML='';
  Q[i].o.forEach(function(t){var b=document.createElement('button');b.type='button';b.className='sb-pill';b.setAttribute('dir','auto');b.textContent=t;
    b.onclick=function(){ans(b,t);};oe.appendChild(b);});
}
function ans(b,t){
  if(lock)return;lock=true;
  var ok=t===Q[i].c;
  [].forEach.call(oe.children,function(x){if(x.textContent===Q[i].c)x.classList.add('ok');});
  if(ok){score++;rs.children[i].classList.add('on');fb.style.color='#3f9d58';fb.textContent='Well done!';}
  else{b.classList.add('no');fb.style.color='#c04747';fb.textContent='Not quite. Look at the green answer.';}
  setTimeout(function(){
    i++;
    if(i>=Q.length){var st=score>=N-1?3:score>=N-3?2:1;
      SB.levelUp({stars:st,text:'You got '+score+' of '+N,next:'index.html'});}
    else show();
  },1500);
}
show();
window.__q={cur:function(){return Q[i]&&Q[i].c;},idx:function(){return i;},click:function(good){var bs=[].slice.call(oe.children);var t=bs.filter(function(x){return (x.textContent===Q[i].c)===good;})[0];t.click();}};
})();
</script>
</body>
</html>
