<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>فوانيس الحروف — عينة</title>
<link rel="stylesheet" href="sb.css?v=2">
<style>
  .stage{position:relative;width:min(92vw,470px);margin:6px auto 0;padding:0}
  .lan-top{height:34px;width:46%;margin:0 auto;background:linear-gradient(#e0a94e,#b8812f 60%,#8f5f1f);border-radius:12px 12px 4px 4px;border:2px solid #7c5218;box-shadow:0 3px 8px #0006;position:relative}
  .lan-top::before{content:"";position:absolute;left:50%;top:-30px;width:34px;height:34px;margin-left:-17px;border:6px solid #c58f3a;border-radius:50%;box-sizing:border-box}
  .lan-body{position:relative;border-radius:46% 46% 44% 44%/36% 36% 34% 34%;padding:16px 14px 14px;margin-top:-4px;
    background:radial-gradient(ellipse at 50% 40%,#fffbe8 0%,#ffe9a8 55%,#f6c25f 100%);
    box-shadow:0 0 50px 14px #ffd96a88,inset 0 0 40px #f2a93a99,inset 0 -10px 24px #d98c2a66}
  .lan-bot{height:26px;width:52%;margin:-2px auto 0;background:linear-gradient(#d9a24a,#a8741f);border-radius:4px 4px 14px 14px;border:2px solid #7c5218;box-shadow:0 4px 8px #0006}
  #g1c{display:block;width:100%;touch-action:none;cursor:crosshair;background:transparent}
  #prog{text-align:center;font-size:19px;font-weight:800;color:var(--sb-navy);min-height:28px;margin-top:6px}
  #word{text-align:center;font-size:17px;font-weight:700;color:#8a6f57;margin-top:2px}
  .sb-dots{margin:8px auto 22px;background:#fff6e9cc;border-radius:14px;padding:6px 8px}
  .sb-sub{background:#fff6e9e6;border-radius:16px;padding:8px 16px;box-shadow:0 3px 10px #0004}
</style>
</head>
<body>
<div class="sb-page" style="background-image:url('assets/sb/scene-g1.jpg')">
  <div class="sb-topbar">
    <a class="sb-roundbtn" href="index.html" aria-label="كل العينات">🏠</a>
    <div class="sb-plaque"><h1>فوانيس الحروف</h1></div>
    <span class="sb-roundbtn" aria-hidden="true">🔊</span>
  </div>
  <p class="sb-sub">امسحي بصباعك فوق الحرف — لما يكمل الفانوس ينور وتسمعي كلمة تبدأ بيه</p>
  <div class="sb-dots" id="dots"></div>
  <div class="stage">
    <div class="lan-top"></div>
    <div class="lan-body"><canvas id="g1c" width="480" height="470"></canvas></div>
    <div class="lan-bot"></div>
    <div id="prog" style="color:#fff;text-shadow:0 2px 6px #000a"></div>
    <div id="word" style="color:#ffe9b0;text-shadow:0 2px 6px #000a"></div>
  </div>
</div>
<script src="sb.js?v=2"></script>
<script>
SB.teacher('full');
(function(){
"use strict";
var cv=document.getElementById('g1c'),ctx=cv.getContext('2d');
var W=480,H=470;
var A='../assets/';
var LETTERS=[
 {ch:'ا',word:'أسد',audio:A+'w-asad-JATU37E5.mp3'},
 {ch:'ب',word:'بطة',audio:A+'w-batta-HFWN7BQY.mp3'},
 {ch:'ت',word:'تفاحة',audio:A+'w-tuffaha-GZEF6Y6Z.mp3'},
 {ch:'ث',word:'ثعلب',audio:A+'w-thaalab-QBX4SFR5.mp3'},
 {ch:'ج',word:'جمل',audio:A+'w-jamal-UNEQW2WZ.mp3'},
 {ch:'ح',word:'حصان',audio:A+'w-hisan-HZX5PBSR.mp3'},
 {ch:'خ',word:'خروف',audio:A+'w-kharuf-IYEXGGHE.mp3'},
 {ch:'د',word:'دب',audio:A+'w-dubb-5VXWH7KL.mp3'},
 {ch:'ذ',word:'ذئب',audio:A+'w-dhib-TYB72P7Y.mp3'},
 {ch:'ر',word:'رمان',audio:A+'w-rumman-RDSCMWAC.mp3'},
 {ch:'ز',word:'زرافة',audio:A+'w-zarafa-2J5ISAVH.mp3'},
 {ch:'س',word:'سمكة',audio:A+'w-samaka-EOUEDDKP.mp3'},
 {ch:'ش',word:'شمس',audio:A+'w-shams-MZOMUSPP.mp3'},
 {ch:'ص',word:'صاروخ',audio:A+'w-sarukh-YE73GRUB.mp3'},
 {ch:'ض',word:'ضفدع',audio:A+'w-difda-RUR5OGUC.mp3'},
 {ch:'ط',word:'طائرة',audio:A+'w-taira-WFB3BHJ7.mp3'},
 {ch:'ظ',word:'ظرف',audio:null},
 {ch:'ع',word:'عصفور',audio:A+'w-usfur-LBZEZG42.mp3'},
 {ch:'غ',word:'غابة',audio:A+'w-ghaba-JWGTYCV4.mp3'},
 {ch:'ف',word:'فيل',audio:A+'w-fil-42SBITZQ.mp3'},
 {ch:'ق',word:'قمر',audio:A+'w-qamar-XEKXXEXQ.mp3'},
 {ch:'ك',word:'كتاب',audio:A+'w-kitab-AFSSQR7N.mp3'},
 {ch:'ل',word:'ليمون',audio:A+'w-laymun-XZERF7RJ.mp3'},
 {ch:'م',word:'موز',audio:A+'w-mawz-KTE25PFQ.mp3'},
 {ch:'ن',word:'نجمة',audio:A+'w-najma-4S4O7DC5.mp3'},
 {ch:'ه',word:'هلال',audio:A+'w-hilal-UM7CDBFV.mp3'},
 {ch:'و',word:'وردة',audio:A+'w-warda-W673IT73.mp3'},
 {ch:'ي',word:'يد',audio:A+'w-yad-ANZLTQWL.mp3'}
];
var idx=0,targets=[],done=false,lit=0,parts=[];
var dotsEl=document.getElementById('dots'),progEl=document.getElementById('prog'),wordEl=document.getElementById('word');
LETTERS.forEach(function(){var d=document.createElement('span');d.className='sb-dot';dotsEl.appendChild(d);});
function buildTargets(){
  targets=[];
  maskCtx.clearRect(0,0,W,H);
  var off=document.createElement('canvas');off.width=W;off.height=H;
  var o=off.getContext('2d');
  o.font='700 250px "Noto Naskh Arabic",serif';
  o.textAlign='center';o.textBaseline='middle';
  o.fillText(LETTERS[idx].ch,W/2,H/2+16);
  var img=o.getImageData(0,0,W,H).data;
  for(var y=0;y<H;y+=7)for(var x=0;x<W;x+=7){
    if(img[(y*W+x)*4+3]>120)targets.push({x:x,y:y,hit:false});
  }
  done=false;
  wordEl.textContent=LETTERS[idx].word+' — '+(idx+1)+' / '+LETTERS.length;
}
function coverage(){var h=0;for(var i=0;i<targets.length;i++)if(targets[i].hit)h++;return targets.length?h/targets.length:0;}
function sparkle(x,y){
  for(var i=0;i<3;i++)parts.push({x:x+(Math.random()*16-8),y:y+(Math.random()*16-8),
    vx:(Math.random()-.5)*1.2,vy:-Math.random()*1.4-.2,t:0,col:Math.random()<.5?'#ffd964':'#f0a92e'});
}
var maskCv=document.createElement('canvas');maskCv.width=W;maskCv.height=H;
var maskCtx=maskCv.getContext('2d');
var goldCv=document.createElement('canvas');goldCv.width=W;goldCv.height=H;
function paintGold(){
  var g=goldCv.getContext('2d');
  g.clearRect(0,0,W,H);
  g.font='700 250px "Noto Naskh Arabic",serif';
  g.textAlign='center';g.textBaseline='middle';
  g.fillStyle='#e2561f';
  g.fillText(LETTERS[idx].ch,W/2,H/2+16);
  g.globalCompositeOperation='destination-in';
  g.drawImage(maskCv,0,0);
  g.globalCompositeOperation='source-over';
}
function draw(){
  ctx.clearRect(0,0,W,H);
  // ghost letter
  ctx.font='700 250px "Noto Naskh Arabic",serif';
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillStyle='#c9a363';
  ctx.fillText(LETTERS[idx].ch,W/2,H/2+16);
  // traced golden letter (letter shape clipped to finger trail)
  paintGold();
  ctx.save();
  ctx.shadowColor='#ffd964';ctx.shadowBlur=done?26:8;
  ctx.drawImage(goldCv,0,0);
  ctx.restore();
  // sparkles
  for(var j=parts.length-1;j>=0;j--){
    var p=parts[j];p.x+=p.vx;p.y+=p.vy;p.t++;
    if(p.t>26){parts.splice(j,1);continue;}
    ctx.globalAlpha=1-p.t/26;
    ctx.fillStyle=p.col;
    ctx.beginPath();ctx.arc(p.x,p.y,2.6,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=1;
  }
  // lantern glow frame when letter complete
  if(done){
    ctx.strokeStyle='#f0b23e';ctx.lineWidth=5;
    ctx.shadowColor='#ffd964';ctx.shadowBlur=30;
    ctx.strokeRect(14,14,W-28,H-28);
    ctx.shadowBlur=0;
  }
}
function trace(x,y){
  if(done)return;
  var r=cv.getBoundingClientRect();
  var px=(x-r.left)*(W/r.width),py=(y-r.top)*(H/r.height);
  var any=false;
  for(var i=0;i<targets.length;i++){
    var t=targets[i];
    if(!t.hit&&Math.abs(t.x-px)<20&&Math.abs(t.y-py)<20){t.hit=true;any=true;
      maskCtx.fillStyle='#000';
      maskCtx.beginPath();maskCtx.arc(t.x,t.y,17,0,Math.PI*2);maskCtx.fill();}
  }
  if(any){
    sparkle(px,py);
    var c=coverage();lit=c;
    progEl.textContent=Math.round(c*100)+'٪';
    if(c>=0.85){
      done=true;lit=1;
      dotsEl.children[idx].classList.add('on');
      progEl.textContent='الفانوس نور!';
      var au=LETTERS[idx].audio;
      if(au){try{new Audio(au).play().catch(function(){});}catch(e){}}
      setTimeout(function(){
        idx++;
        if(idx>=LETTERS.length){
          SB.levelUp({stars:3,text:'نورتي فوانيس الحروف كلها من الألف للياء',next:'g2.html'});
        }else{buildTargets();progEl.textContent='';}
      },1500);
    }
  }
}
var drawing=false;
cv.addEventListener('pointerdown',function(e){drawing=true;trace(e.clientX,e.clientY);});
cv.addEventListener('pointermove',function(e){if(drawing)trace(e.clientX,e.clientY);});
window.addEventListener('pointerup',function(){drawing=false;});
buildTargets();
(function loop(){draw();requestAnimationFrame(loop);})();
})();
</script>
</body>
</html>
