<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>صح أم خطأ — عينة</title>
<link rel="stylesheet" href="sb.css?v=3">
<style>
.book{width:100%;max-width:min(520px,94vw);box-sizing:border-box;background:#fffdf8;border:4px solid #c98f4f;border-radius:20px;
  box-shadow:0 6px 0 #a8743a,0 14px 28px #5d3c1540;padding:12px}
.book img{display:block;width:100%;height:min(26vh,210px);object-fit:cover;border-radius:12px;border:2px solid #e8c07a}
#q{font-size:23px;font-weight:800;color:var(--sb-navy);text-align:center;margin:12px 6px 6px;min-height:68px;display:flex;align-items:center;justify-content:center}
#fb{min-height:26px;text-align:center;font-size:18px;font-weight:800}
.tf{display:flex;gap:14px;justify-content:center;margin-top:14px;width:100%;max-width:min(520px,94vw)}
.tf .sb-pill{flex:1;font-size:26px;padding:12px 0}
#rounds{display:flex;gap:6px;justify-content:center;margin:2px 0 8px}
#rounds .sb-star{width:24px;height:24px}
.sb-teacher{height:min(22vh,190px)!important}
</style>
</head>
<body>
<div class="sb-page" style="background:#fff3dc">
  <div class="sb-topbar">
    <a class="sb-roundbtn" href="index.html" aria-label="كل العينات">🏠</a>
    <div class="sb-plaque"><h1>صح أم خطأ</h1></div>
    <span class="sb-roundbtn" style="visibility:hidden"></span>
  </div>
  <div class="book">
    <div id="rounds"></div>
    <img src="assets/sb/art-mosque.jpg" alt="">
    <div id="q"></div>
    <div id="fb"></div>
  </div>
  <div class="tf">
    <button class="sb-pill green" id="t" type="button">✓ صح</button>
    <button class="sb-pill red" id="f" type="button">✗ خطأ</button>
  </div>
</div>
<script src="sb.js?v=3"></script>
<script>
SB.teacher('full');
(function(){
"use strict";
var Q=[
 {t:'أركان الإسلام خمسة',a:true},
 {t:'نصلي ستّ صلوات في اليوم والليلة',a:false},
 {t:'الكعبة المشرفة في مكة المكرمة',a:true},
 {t:'نصوم شهر رمضان في الشهر التاسع من السنة الهجرية',a:true},
 {t:'سورة الفاتحة هي آخر سورة في المصحف',a:false}
];
var i=0,score=0,lock=false;
var qE=document.getElementById('q'),fb=document.getElementById('fb'),rs=document.getElementById('rounds');
Q.forEach(function(){var s=document.createElement('div');s.className='sb-star';rs.appendChild(s);});
function show(){qE.textContent=Q[i].t;fb.textContent='';lock=false;}
function ans(v){
  if(lock)return;lock=true;
  var ok=v===Q[i].a;
  if(ok){score++;rs.children[i].classList.add('on');fb.style.color='#3f9d58';fb.textContent='أحسنتِ! إجابة صح';}
  else{fb.style.color='#c04747';fb.textContent='حاولي تاني — الإجابة: '+(Q[i].a?'صح':'خطأ');}
  setTimeout(function(){
    i++;
    if(i>=Q.length){var st=score>=Q.length-1?3:score>=Q.length-2?2:1;
      SB.levelUp({stars:st,text:'جاوبتي '+score+' من '+Q.length,next:'index.html'});}
    else show();
  },1300);
}
document.getElementById('t').onclick=function(){ans(true);};
document.getElementById('f').onclick=function(){ans(false);};
show();
window.__g7={ans:ans,cur:function(){return Q[i]&&Q[i].a;},idx:function(){return i;}};
})();
</script>
</body>
</html>
