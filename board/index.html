<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>سَبُّورَةُ لِيسَانُورَا</title>
<meta name="description" content="سبورة تفاعلية للمعلمة فاطمة سامح - أدوات الحصة والرسم والشرح">
<meta http-equiv="Cache-Control" content="no-cache">
<meta name="theme-color" content="#d16a92">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri+Quran&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<script src="https://fatmasamehedu-cyber.github.io/lisanura/assets/supa-config.js"></script>
<script src="https://fatmasamehedu-cyber.github.io/lisanura/assets/supa.js"></script>
<style>
@font-face{font-family:'Naskh';src:url('https://fatmasamehedu-cyber.github.io/lisanura/fonts/NotoNaskhArabic-Regular.ttf') format('truetype');font-weight:400}
@font-face{font-family:'Naskh';src:url('https://fatmasamehedu-cyber.github.io/lisanura/fonts/NotoNaskhArabic-Bold.ttf') format('truetype');font-weight:700}
@font-face{font-family:'SansAr';src:url('https://fatmasamehedu-cyber.github.io/lisanura/fonts/NotoSansArabic-Regular.ttf') format('truetype');font-weight:400}
@font-face{font-family:'SansAr';src:url('https://fatmasamehedu-cyber.github.io/lisanura/fonts/NotoSansArabic-Bold.ttf') format('truetype');font-weight:700}
:root{
  --rose:#d16a92; --rose-d:#8a1f4a; --maroon:#7c2d49; --gold:#d9a44f; --blue:#4f7fd9;
  --bg:#fdf3f7; --card:#ffffff; --ink:#4a2333; --line:#f2b7c9;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden}
body{font-family:'SansAr',sans-serif;background:var(--bg);color:var(--ink)}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
h1,h2,h3{font-family:'Naskh',serif;margin:0}
svg.ic{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
svg.ic.fill{fill:currentColor;stroke:none}

/* full-screen canvas */
#boardWrap{position:fixed;inset:0;overflow:hidden;background:#fff}
#boardWrap canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#bgCanvas{pointer-events:none}
#drawCanvas{cursor:crosshair;z-index:2}
.mascot{position:fixed;bottom:70px;inset-inline-end:8px;width:64px;pointer-events:none;filter:drop-shadow(0 3px 6px rgba(0,0,0,.2));z-index:5}

/* floating top bar */
.topbar{position:fixed;top:8px;left:0;right:0;margin:0 auto;width:fit-content;max-width:calc(100vw - 16px);display:flex;align-items:center;gap:6px;padding:5px 8px;background:rgba(255,255,255,.94);border:2px solid var(--line);border-radius:30px;box-shadow:0 6px 20px rgba(124,45,73,.18);z-index:30;overflow-x:auto;scrollbar-width:none}
.topbar::-webkit-scrollbar{display:none}
.topbar .title{display:flex;align-items:center;gap:6px;white-space:nowrap;font-family:'Naskh',serif;font-weight:700;font-size:19px;color:var(--rose-d)}
.topbar .title img{width:32px;height:32px;border-radius:50%;background:#fff;border:2px solid var(--line);object-fit:cover}
.tbtn{display:flex;align-items:center;justify-content:center;min-width:36px;height:36px;padding:0 9px;border-radius:12px;background:#fff;border:2px solid var(--line);color:var(--rose-d);font-size:15px;font-weight:700;transition:.15s;flex:0 0 auto}
.tbtn:hover{background:#fdeef4}
.tbtn:active{transform:scale(.94)}
.tbtn.gold{border-color:var(--gold);color:#8a6512}
.pagenav{display:flex;align-items:center;gap:2px;background:#fff;border:2px solid var(--line);border-radius:12px;padding:1px 4px;flex:0 0 auto}
.pagenav b{font-size:13px;min-width:58px;text-align:center;color:var(--maroon);white-space:nowrap}
.pagenav button{width:28px;height:28px;border-radius:8px;font-size:15px;color:var(--rose-d);display:flex;align-items:center;justify-content:center}
.pagenav button:hover{background:#fdeef4}
.pagenav button svg{width:16px;height:16px}

/* floating rail */
.rail{position:fixed;inset-inline-start:8px;top:78px;bottom:86px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 3px;background:rgba(255,255,255,.94);border:2px solid var(--line);border-radius:20px;box-shadow:0 6px 20px rgba(124,45,73,.18);z-index:25;overflow-y:auto;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail button{width:48px;min-height:44px;border-radius:12px;border:2px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:17px;color:var(--maroon);gap:1px;padding:2px}
.rail button span{font-size:9px;font-weight:700;white-space:nowrap}
.rail button:hover{background:#fdeef4}
.rail button.on{background:var(--rose);color:#fff;border-color:var(--rose-d)}
.rail .sep{width:34px;height:2px;background:var(--line);border-radius:2px;margin:2px 0}

/* floating bottom bar */
.bottombar{position:fixed;bottom:8px;left:0;right:0;margin:0 auto;width:fit-content;max-width:calc(100vw - 16px);display:flex;align-items:center;gap:10px;padding:6px 12px;background:rgba(255,255,255,.94);border:2px solid var(--line);border-radius:30px;box-shadow:0 6px 20px rgba(124,45,73,.18);z-index:25;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.bottombar::-webkit-scrollbar{display:none}
.swatches{display:flex;gap:5px;align-items:center}
.sw{width:27px;height:27px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--line);transition:.12s;flex:0 0 auto}
.sw.on{box-shadow:0 0 0 3px var(--rose-d);transform:scale(1.15)}
.sizebox{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700;color:var(--maroon);white-space:nowrap}
input[type=range]{accent-color:var(--rose);width:90px}
#sizePreview{width:30px;height:30px;border-radius:50%;background:#fff;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
#sizeDot{background:var(--rose-d);border-radius:50%}

/* popovers */
.pop{position:fixed;background:#fff;border:2px solid var(--line);border-radius:14px;box-shadow:0 8px 24px rgba(124,45,73,.25);padding:8px;display:none;z-index:40;flex-direction:column;gap:4px;min-width:140px;max-height:80vh;overflow-y:auto}
.pop.open{display:flex}
.pop button.popt{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;font-size:14px;font-weight:700;color:var(--maroon);text-align:start}
.pop button.popt:hover{background:#fdeef4}
.pop button.popt.on{background:var(--rose);color:#fff}
.bgGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.bgGrid button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px;border-radius:10px;font-size:10px;font-weight:700;color:var(--maroon);border:2px solid transparent}
.bgGrid button:hover{background:#fdeef4}
.bgGrid button.on{border-color:var(--rose-d);background:#fdeef4}
.bgGrid canvas{width:64px;height:44px;border-radius:6px;border:1px solid var(--line)}
.stickerGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;max-height:220px;overflow-y:auto}
.stickerGrid button{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center}
.stickerGrid button:hover{background:#fdeef4}
.stickerGrid canvas{width:34px;height:34px}
.stampList{display:flex;flex-direction:column;gap:6px}
.stampOpt{display:flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;border-radius:30px;color:#fff;font-family:'Naskh',serif;font-weight:700;font-size:18px;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.stampOpt svg{width:18px;height:18px}
#magTray{min-height:44px;width:100%;border:2px dashed var(--line);border-radius:10px;font-family:'Naskh',serif;font-size:30px;text-align:center;color:var(--maroon);padding:2px 6px}

/* widget panel */
.widgetPanel{position:fixed;top:0;bottom:0;inset-inline-end:0;width:210px;background:#fffdf8;border-inline-start:2px solid var(--gold);box-shadow:-4px 0 18px rgba(0,0,0,.12);z-index:35;padding:14px 10px;display:none;flex-direction:column;gap:7px;overflow-y:auto}
.widgetPanel.open{display:flex}
.widgetPanel h3{color:var(--rose-d);font-size:19px;text-align:center;margin-bottom:4px}
.witem{display:flex;align-items:center;gap:9px;padding:9px;border-radius:14px;border:2px solid var(--line);background:#fff;font-size:14px;font-weight:700;color:var(--maroon);transition:.15s}
.witem:hover{background:#fdeef4}
.witem .ic{color:var(--rose)}

/* floating widget cards */
.fcard{position:fixed;background:#fff;border:2px solid var(--rose);border-radius:16px;box-shadow:0 10px 30px rgba(124,45,73,.3);z-index:45;min-width:230px;max-width:340px;max-width:calc(100vw - 24px);max-height:calc(100vh - 110px);display:flex;flex-direction:column;overflow:hidden}
.fcard .fhead{display:flex;align-items:center;gap:6px;background:linear-gradient(135deg,var(--rose),var(--rose-d));color:#fff;padding:6px 10px;font-weight:700;font-size:14px;cursor:move;user-select:none;touch-action:none}
.fcard .fhead .fx{margin-inline-start:auto;width:24px;height:24px;border-radius:8px;color:#fff;font-size:14px;display:flex;align-items:center;justify-content:center}
.fcard .fhead .fx:hover{background:rgba(255,255,255,.25)}
.fcard .fbody{padding:12px;display:flex;flex-direction:column;gap:8px;align-items:center;max-height:70vh;overflow-y:auto}
.fcard textarea{width:100%;min-height:74px;border:2px solid var(--line);border-radius:10px;padding:6px;font-family:inherit;font-size:14px;resize:vertical;direction:rtl}
.fcard select{width:100%;border:2px solid var(--line);border-radius:10px;padding:8px;font-family:'Naskh',serif;font-size:17px;background:#fff;color:var(--maroon)}
.abtn{background:var(--rose);color:#fff;border-radius:12px;padding:8px 18px;font-size:15px;font-weight:700;transition:.15s;box-shadow:0 3px 0 var(--rose-d);display:inline-flex;align-items:center;gap:6px}
.abtn:hover{filter:brightness(1.08)}
.abtn:active{transform:translateY(2px);box-shadow:none}
.abtn.gold{background:var(--gold);box-shadow:0 3px 0 #a5772b;color:#5c3d10}
.abtn.blue{background:var(--blue);box-shadow:0 3px 0 #274a86}
.abtn.ghost{background:#fff;color:var(--rose-d);border:2px solid var(--line);box-shadow:none}
.bigtime{font-family:'Naskh',serif;font-size:52px;font-weight:700;color:var(--maroon);direction:ltr}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
.teamrow{display:flex;align-items:center;gap:8px;width:100%;background:#fdf3f7;border-radius:12px;padding:6px 10px}
.teamrow input{flex:1;min-width:60px;border:none;background:transparent;font-family:inherit;font-weight:700;font-size:15px;color:var(--maroon);border-bottom:2px dashed var(--line);text-align:center}
.teamrow .sc{font-family:'Naskh',serif;font-size:26px;font-weight:700;color:var(--rose-d);min-width:44px;text-align:center;direction:ltr}
.pm{width:30px;height:30px;border-radius:50%;font-size:18px;font-weight:700;color:#fff;background:var(--rose)}
.pm.minus{background:#b9bec5}
.tl{width:64px;background:#333;border-radius:16px;padding:8px;display:flex;flex-direction:column;gap:8px;align-items:center}
.tl .bulb{width:44px;height:44px;border-radius:50%;background:#222;border:2px solid #111;opacity:.35;transition:.2s;cursor:pointer}
.tl .bulb.on{opacity:1;box-shadow:0 0 18px 4px currentColor}
#wheelCv{max-width:100%}
.qres{font-family:'Amiri Quran','Naskh',serif;font-size:20px;color:var(--maroon);background:#fffdf6;border:2px solid var(--gold);border-radius:12px;padding:10px;max-height:150px;overflow-y:auto;text-align:center;line-height:2}
body.viewer .rail,body.viewer .bottombar{display:none}
body.viewer .topbar .tbtn:not(#fsBtn):not(#backBtn),body.viewer .pagenav button,body.viewer #saveState{display:none}
body.viewer .pagenav{border:none}
.liveBadge{position:fixed;top:64px;left:50%;transform:translateX(-50%);background:var(--maroon);color:#fff;padding:6px 18px;border-radius:20px;font-size:13px;font-weight:700;z-index:28;display:none}
body.viewer .liveBadge{display:block}
.bookrow{display:flex;align-items:center;gap:8px;width:100%;background:#fdf3f7;border-radius:10px;padding:8px}
.bookrow b{flex:1;font-size:13px;color:var(--maroon);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

#textEntry{position:fixed;display:none;z-index:50}
#textEntry textarea{background:rgba(255,255,255,.92);border:2px dashed var(--rose);border-radius:8px;padding:4px 8px;font-family:'Naskh',serif;direction:rtl;outline:none;resize:both;min-width:120px;min-height:40px}
.toast{position:fixed;bottom:76px;left:50%;transform:translateX(-50%);background:var(--maroon);color:#fff;padding:10px 22px;border-radius:30px;font-size:14px;font-weight:700;z-index:99;display:none;box-shadow:0 6px 18px rgba(0,0,0,.3);max-width:88vw;text-align:center}

@media (min-width:761px){
  .rail{top:64px;bottom:72px}
}
@media (max-width:760px){
  .topbar .title b{display:none}
  .topbar .title img{width:28px;height:28px}
  .tbtn{min-width:33px;height:33px;padding:0 7px}
  .rail button{width:46px;min-height:46px}
  .rail button span{font-size:8px}
  .widgetPanel{width:180px}
  .mascot{width:48px;bottom:64px}
  .sw{width:24px;height:24px}
  input[type=range]{width:64px}
  .sizebox span{display:none}
}
@media (max-width:480px){
  .topbar{gap:4px;padding:4px 6px;-webkit-mask-image:linear-gradient(to left,transparent 0,#000 20px,#000 calc(100% - 20px),transparent 100%);mask-image:linear-gradient(to left,transparent 0,#000 20px,#000 calc(100% - 20px),transparent 100%)}
  .tbtn{min-width:30px;height:30px;padding:0 5px}
  svg.ic{width:20px;height:20px}
  .pagenav b{font-size:11px;min-width:44px}
  .pagenav button{width:24px;height:24px}
  .rail button{width:42px;min-height:42px}
  .bottombar{gap:4px;padding:5px 6px}
  .sw{width:20px;height:20px}
  #sizePreview{width:24px;height:24px}
  input[type=range]{width:50px}
}
/* short screens: phone landscape */
@media (max-height:480px){
  .topbar{top:4px}
  .rail{top:58px;bottom:62px}
  .rail button{min-height:38px}
  .bottombar{bottom:4px;padding:4px 10px}
  .liveBadge{top:52px}
  .mascot{display:none}
  .toast{bottom:60px}
}
</style>
</head>
<body>
<div id="boardWrap">
  <canvas id="bgCanvas"></canvas>
  <canvas id="drawCanvas"></canvas>
</div>
<img class="mascot" src="teacher-full.png" alt="">

<div class="topbar">
  <button class="tbtn" id="backBtn" title="الصفحة الرئيسية" style="gap:4px;padding-inline:10px"><svg class="ic" viewBox="0 0 24 24"><path d="M4 11l8-7 8 7"/><path d="M6.5 9.5V20h11V9.5"/></svg><b style="font-family:Naskh;font-size:15px">الرئيسية</b></button>
  <div class="title"><img src="teacher-point.png" alt=""><b>سَبُّورَةُ لِيسَانُورَا</b></div>
  <div class="pagenav">
    <button id="pgPrev" title="الصفحة السابقة"><svg class="ic" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
    <b id="pgLabel">صفحة ١ من ١</b>
    <button id="pgNext" title="الصفحة التالية"><svg class="ic" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
    <button id="pgAdd" title="صفحة جديدة"><svg class="ic" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    <button id="pgDel" title="حذف الصفحة"><svg class="ic" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg></button>
  </div>
  <span id="saveState" style="font-size:11px;color:#a4748a;white-space:nowrap"></span>
  <button class="tbtn" id="undoBtn" title="تراجع"><svg class="ic" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
  <button class="tbtn" id="redoBtn" title="إعادة"><svg class="ic" viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
  <button class="tbtn" id="clearBtn" title="مسح الصفحة"><svg class="ic" viewBox="0 0 24 24"><path d="M4 20l2-9 4-2 2-5 3 3-2 4-4 3-5 6z"/><path d="M14 16l6 4M17 13l3 7"/></svg></button>
  <button class="tbtn" id="pngBtn" title="تنزيل صورة للصفحة"><svg class="ic" viewBox="0 0 24 24"><path d="M12 4v11M6 10l6 6 6-6"/><path d="M4 20h16"/></svg></button>
  <button class="tbtn" id="pdfBtn" title="تنزيل كل الصفحات PDF"><svg class="ic" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></svg></button>
  <button class="tbtn" id="shareBtn" title="مشاركة مع الطالب برابط"><svg class="ic" viewBox="0 0 24 24"><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8.2 10.8l7.5-3.6M8.2 13.2l7.5 3.6"/></svg></button>
  <button class="tbtn" id="fsBtn" title="ملء الشاشة"><svg class="ic" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  <button class="tbtn gold" id="wPanelBtn" title="أدوات الحصة"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="12" rx="2"/><path d="M9 8V6a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/></svg></button>
  <button class="tbtn" id="acctBtn" title="حسابي"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 5-6 8-6s6.5 2 8 6"/></svg></button>
</div>

<div class="rail" id="rail">
  <button data-tool="pen" class="on"><svg class="ic" viewBox="0 0 24 24"><path d="M4 20l1-4L16.5 4.5a2.1 2.1 0 0 1 3 3L8 19l-4 1z"/><path d="M14.5 6.5l3 3"/></svg><span>قلم</span></button>
  <button data-tool="marker"><svg class="ic" viewBox="0 0 24 24"><path d="M5 15L14 6l4 4-9 9H5v-4z"/><path d="M3 21h8"/></svg><span>هايلايتر</span></button>
  <button data-tool="eraser"><svg class="ic" viewBox="0 0 24 24"><path d="M7 20l-4-4L14 5l5 5-8 8H7z"/><path d="M11 8l5 5"/><path d="M9 20h12"/></svg><span>مساحة</span></button>
  <div class="sep"></div>
  <button data-tool="shapes" id="shapesBtn"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="3" width="10" height="10" rx="1"/><circle cx="16" cy="16" r="5"/></svg><span>أشكال</span></button>
  <button data-tool="smart" id="smartBtn"><svg class="ic" viewBox="0 0 24 24"><path d="M6 21L18 9"/><path d="M15 4l1 2 2 1-2 1-1 2-1-2-2-1 2-1 1-2z"/></svg><span>ذكي</span></button>
  <button data-tool="text"><svg class="ic" viewBox="0 0 24 24"><path d="M6 5h12M12 5v14M9 19h6"/></svg><span>نص</span></button>
  <div class="sep"></div>
  <button data-tool="stickers" id="stickerBtn"><svg class="ic" viewBox="0 0 24 24"><path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 5.9-5.3-3-5.3 3 1.2-5.9L3 9.3l6-.7L12 3z"/></svg><span>ملصقات</span></button>
  <button data-tool="stamps" id="stampBtn"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="9" r="5"/><path d="M9 13.5L7 21l5-2.5L17 21l-2-7.5"/></svg><span>أختام</span></button>
  <button data-tool="magnet" id="magnetBtn"><svg class="ic" viewBox="0 0 24 24"><path d="M6 3v8a6 6 0 0 0 12 0V3h-4v8a2 2 0 0 1-4 0V3H6z"/></svg><span>حروف</span></button>
  <div class="sep"></div>
  <button data-tool="image"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M4 18l5-5 4 4 3-3 4 4"/></svg><span>صورة</span></button>

<script>
window.__errs=[];window.onerror=function(m,s,l,c){window.__errs.push(m+' @'+l+':'+c)};
'use strict';
/* ================= core ================= */
const wrap=document.getElementById('boardWrap'),cv=document.getElementById('drawCanvas'),bgCv=document.getElementById('bgCanvas');
const ctx=cv.getContext('2d'),bgCtx=bgCv.getContext('2d');
let cssW=innerWidth,cssH=innerHeight,dpr=Math.min(devicePixelRatio||1,2);
const X=v=>v*cssW,Y=v=>v*cssH,SZ=v=>v*cssH;
function fit(){cssW=innerWidth;cssH=innerHeight;
  [cv,bgCv].forEach(c=>{c.width=Math.round(cssW*dpr);c.height=Math.round(cssH*dpr);});
  redraw();}
addEventListener('resize',fit);

let state={pages:[{bg:'blank',strokes:[]}],cur:0};
let tool='pen',shape='line',color='#7c2d49',penSize=6,smartOn=true,readOnly=false;
const PALETTE=['#7c2d49','#d16a92','#d9a44f','#4f7fd9','#3aa77c','#e05c5c','#7a54c9','#222222','#ffffff','#8a5a2b'];
const LS='lisanura-board-v2';
function curPage(){return state.pages[state.cur];}
let saveT=null;
function isTeacherOnline(){return !!(window.LN&&LN.configured()&&LN.user&&LN.profile&&LN.profile.role==='teacher');}
function setSaveState(s){const el=document.getElementById('saveState');if(!el)return;
  if(s!==undefined){el.textContent=s;return;}
  el.textContent=isTeacherOnline()?'محفوظ في حسابك':'حفظ محلي على هذا الجهاز';}
function save(){if(readOnly)return;try{const d=JSON.stringify(state,p=>(typeof p==='object'&&p&&p._img)?{...p,_img:undefined}:p);
  if(d.length<4.5e6)localStorage.setItem(LS,d);}catch(e){}
  if(window.LN&&LN.configured())try{
    LN.saveBoard(JSON.parse(JSON.stringify(state,(k,v)=>k==='_img'?undefined:v)),st=>{
      if(st==='saving')setSaveState('جاري الحفظ في حسابك...');
      else if(st==='saved')setSaveState('محفوظ في حسابك');
      else setSaveState('تعذر الحفظ السحابي');});
    if(!isTeacherOnline()){setSaveState('حُفظ محليًا');flashSave();}
  }catch(e){setSaveState('حُفظ محليًا');flashSave();}}
function flashSave(){clearTimeout(saveT);saveT=setTimeout(()=>setSaveState(),1600);}
document.addEventListener('ln-auth',()=>setSaveState());
function migrate(o){ /* v1: world 1600x1000, sizes in px */
  o.pages.forEach(p=>p.strokes.forEach(s=>{
    if(s.kind==='stroke'){s.points=s.points.map(pt=>[pt[0]/1600,pt[1]/1000,1]);s.size/=1000;}
    else if(s.kind==='shape'){s.x0/=1600;s.x1/=1600;s.y0/=1000;s.y1/=1000;s.size/=1000;}
    else if(s.kind==='text'){s.x/=1600;s.y/=1000;s.size/=1000;}
    else if(s.kind==='image'){s.x/=1600;s.w/=1600;s.y/=1000;s.h/=1000;}
  }));return o;}
function load(){try{const d=localStorage.getItem(LS)||localStorage.getItem('lisanura-board-v1');
  if(d){const s=JSON.parse(d);if(s&&s.pages&&s.pages.length)state=migrate(s);}}catch(e){}
  if(state.cur>=state.pages.length)state.cur=0;}
function rehydrate(){state.pages.forEach(p=>p.strokes.forEach(s=>{if(s.kind==='image'&&s.src&&!s._img){const im=new Image();im.onload=redraw;im.src=s.src;s._img=im;}}));}

/* undo/redo */
let undoStack=[],redoStack=[];
function pushUndo(){undoStack.push(JSON.stringify(curPage().strokes,(k,v)=>k==='_img'?undefined:v));if(undoStack.length>60)undoStack.shift();redoStack=[];}

/* ================= backgrounds ================= */
const LAYOUTS=[['blank','سادة'],['lines','سطور'],['narrow','سطور ضيقة'],['two','سطرين'],['nine','٩ أسطر'],['grid','شبكة'],['dots','نقط'],['iso','أيزومتري'],['graph','بياني'],['dark','سبورة خضراء']];
const SCENES=[['rainbow','قوس قزح'],['night','ليل ونجوم'],['balloons','بالونات'],['meadow','حديقة'],['sea','بحر'],['hearts','قلوب'],['lanterns','فوانيس'],['sprinkles','نثار نجوم']];
function drawLayout(c,bg,W,H,boost){
  boost=boost||1;
  c.fillStyle=bg==='dark'?'#2e4a3e':bg==='blank'?'#ffffff':'#fffdf6';c.fillRect(0,0,W,H);
  c.save();
  const lc=bg==='dark'?'rgba(255,255,255,.35)':'rgba(79,127,217,.45)';
  if(bg==='lines'||bg==='narrow'||bg==='two'||bg==='nine'){
    c.strokeStyle=lc;c.lineWidth=H/500*boost;
    const gap=bg==='narrow'?H/16:bg==='nine'?H/11:bg==='two'?H/6:H/9;
    for(let y=gap;y<H;y+=gap){c.beginPath();c.moveTo(W*.03,y);c.lineTo(W*.97,y);c.stroke();
      if(bg==='two'){c.beginPath();c.moveTo(W*.03,y+gap*.28);c.lineTo(W*.97,y+gap*.28);c.stroke();}}}
  else if(bg==='grid'){c.strokeStyle=bg==='dark'?'rgba(255,255,255,.18)':'rgba(209,106,146,.34)';c.lineWidth=H/500*boost;
    const g=H/12;for(let x=0;x<=W;x+=g){c.beginPath();c.moveTo(x,0);c.lineTo(x,H);c.stroke();}
    for(let y=0;y<=H;y+=g){c.beginPath();c.moveTo(0,y);c.lineTo(W,y);c.stroke();}}
  else if(bg==='dots'){c.fillStyle='rgba(124,45,73,.55)';const g=H/14,r=H/250*boost;
    for(let x=g;x<W;x+=g)for(let y=g;y<H;y+=g){c.beginPath();c.arc(x,y,r,0,7);c.fill();}}
  else if(bg==='iso'){c.strokeStyle='rgba(122,84,199,.42)';c.lineWidth=H/600*boost;const g=H/12,h=g*.866;
    for(let y=0,r=0;y<H+h;y+=h,r++){c.beginPath();for(let x=0;x<W+g;x+=g){const xx=x+(r%2?g/2:0);c.moveTo(xx,y);c.lineTo(xx+g/2,y+h);c.moveTo(xx,y);c.lineTo(xx-g/2,y+h);}c.stroke();}}
  else if(bg==='graph'){c.strokeStyle='rgba(79,127,217,.32)';c.lineWidth=boost;const g=H/20;
    for(let x=0;x<=W;x+=g){c.beginPath();c.moveTo(x,0);c.lineTo(x,H);c.stroke();}
    for(let y=0;y<=H;y+=g){c.beginPath();c.moveTo(0,y);c.lineTo(W,y);c.stroke();}
    c.strokeStyle='#4f7fd9';c.lineWidth=H/300;
    c.beginPath();c.moveTo(W/2,0);c.lineTo(W/2,H);c.moveTo(0,H/2);c.lineTo(W,H/2);c.stroke();}
  c.restore();}
function cloud(c,x,y,s,col){c.fillStyle=col;c.beginPath();c.arc(x,y,s,0,7);c.arc(x+s*.9,y+s*.15,s*.75,0,7);c.arc(x-s*.9,y+s*.15,s*.7,0,7);c.arc(x+s*.3,y-s*.5,s*.6,0,7);c.fill();}
function star5(c,x,y,R,col){c.fillStyle=col;c.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,r=i%2?R*.45:R;const px=x+r*Math.cos(a),py=y+r*Math.sin(a);i?c.lineTo(px,py):c.moveTo(px,py);}c.closePath();c.fill();}
function heart(c,x,y,s,col){c.fillStyle=col;c.beginPath();c.moveTo(x,y+s*.9);c.bezierCurveTo(x-s*1.2,y,x-s*.6,y-s,s,y-s*.3);c.bezierCurveTo(x+s*.6,y-s,x+s*1.2,y,x,y+s*.9);c.fill();}
function crescent(c,x,y,R,col){c.fillStyle=col;c.beginPath();c.arc(x,y,R,0,7);c.fill();c.fillStyle='rgba(0,0,0,0)';c.globalCompositeOperation='destination-out';c.beginPath();c.arc(x+R*.4,y-R*.2,R*.85,0,7);c.fill();c.globalCompositeOperation='source-over';}
function drawScene(c,bg,W,H){
  if(bg==='rainbow'){const g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,'#bfe3f7');g.addColorStop(1,'#fdeef4');c.fillStyle=g;c.fillRect(0,0,W,H);
    const cx=W*.5,cy=H*1.05;['#f7a8b8','#f9cf8e','#fbe9a0','#a8dcb5','#a8c8ec','#d3b3e5'].forEach((col,i)=>{c.strokeStyle=col;c.lineWidth=H*.045;c.beginPath();c.arc(cx,cy,H*(.75-i*.045),Math.PI,2*Math.PI);c.stroke();});
    cloud(c,W*.18,H*.16,H*.07,'#ffffff');cloud(c,W*.8,H*.24,H*.055,'#ffffff');cloud(c,W*.55,H*.12,H*.045,'#fdf3f7');}
  else if(bg==='night'){c.fillStyle='#3d3d6b';c.fillRect(0,0,W,H);
    for(let i=0;i<70;i++){const x=(i*97%100)/100*W,y=(i*57%100)/100*H*.9;c.fillStyle=i%5?'#fdf6d8':'#fff';c.globalAlpha=.4+(i%3)*.3;c.beginPath();c.arc(x,y,(i%3)+1,0,7);c.fill();}
    c.globalAlpha=1;star5(c,W*.15,H*.2,H*.03,'#f9cf8e');star5(c,W*.85,H*.3,H*.02,'#fdf6d8');
    c.fillStyle='#f9e9a8';c.beginPath();c.arc(W*.78,H*.18,H*.07,0,7);c.fill();c.fillStyle='#3d3d6b';c.beginPath();c.arc(W*.81,H*.16,H*.06,0,7);c.fill();
    cloud(c,W*.3,H*.75,H*.06,'#55558a');}
  else if(bg==='balloons'){c.fillStyle='#fdf3f7';c.fillRect(0,0,W,H);
    const cols=['#f7a8b8','#a8c8ec','#f9cf8e','#a8dcb5','#d3b3e5','#f5b8c9'];
    for(let i=0;i<8;i++){const x=W*(0.08+i*0.12),y=H*(0.18+((i*37)%40)/100),s=H*.055,col=cols[i%6];
      c.strokeStyle='#c9a0b0';c.lineWidth=1.5;c.beginPath();c.moveTo(x,y+s*1.2);c.quadraticCurveTo(x+8,y+s*2,x,y+s*2.6);c.stroke();
      c.fillStyle=col;c.beginPath();c.ellipse(x,y,s*.85,s*1.1,0,0,7);c.fill();
      c.fillStyle='rgba(255,255,255,.5)';c.beginPath();c.ellipse(x-s*.3,y-s*.35,s*.2,s*.32,-.5,0,7);c.fill();}}
  else if(bg==='meadow'){c.fillStyle='#d8f0e4';c.fillRect(0,0,W,H);
    c.fillStyle='#a8dcb5';c.beginPath();c.ellipse(W*.25,H*1.05,W*.5,H*.35,0,0,7);c.fill();
    c.fillStyle='#8fd0a5';c.beginPath();c.ellipse(W*.85,H*1.08,W*.45,H*.32,0,0,7);c.fill();
    c.fillStyle='#f9e9a8';c.beginPath();c.arc(W*.85,H*.14,H*.06,0,7);c.fill();
    for(let i=0;i<8;i++){const x=W*((i*13+7)%90)/100+W*.05,y=H*(.72+((i*29)%20)/100),s=H*.016;
      for(let p=0;p<5;p++){const a=p*2*Math.PI/5-Math.PI/2;c.fillStyle=['#f7a8b8','#d3b3e5','#f9cf8e'][i%3];c.beginPath();c.arc(x+s*Math.cos(a),y+s*Math.sin(a),s*.8,0,7);c.fill();}
      c.fillStyle='#f9e9a8';c.beginPath();c.arc(x,y,s*.55,0,7);c.fill();}}
  else if(bg==='sea'){const g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,'#d4ecfa');g.addColorStop(.55,'#a8d4f0');g.addColorStop(.56,'#7fb8e0');g.addColorStop(1,'#5c9fd0');c.fillStyle=g;c.fillRect(0,0,W,H);
    c.fillStyle='#f9e9a8';c.beginPath();c.arc(W*.82,H*.15,H*.055,0,7);c.fill();
    c.strokeStyle='rgba(255,255,255,.65)';c.lineWidth=H/220;c.lineCap='round';
    for(let r=0;r<4;r++){const y=H*(.63+r*.1);c.beginPath();for(let x=0;x<=W;x+=W/24){c.arc(x+x,y,0,0,0);c.moveTo(x,y);c.quadraticCurveTo(x+W/48,y-H*.02,x+W/24,y);}c.stroke();}}
  else if(bg==='hearts'){c.fillStyle='#fdeef4';c.fillRect(0,0,W,H);
    const cols=['#f7a8b8','#f5b8c9','#e8a4c0','#f9cf8e'];
    for(let i=0;i<16;i++){const x=W*((i*23+9)%92)/100+W*.04,y=H*((i*31+13)%88)/100+H*.06;heart(c,x,y,H*.022,cols[i%4]);}}
  else if(bg==='lanterns'){c.fillStyle='#fdf3e6';c.fillRect(0,0,W,H);
    for(let i=0;i<7;i++){const x=W*(0.1+i*0.135),y=H*(0.1+((i*41)%18)/100),w=H*.05;
      c.strokeStyle='#c9a0b0';c.lineWidth=1.5;c.beginPath();c.moveTo(x,0);c.lineTo(x,y);c.stroke();
      c.fillStyle=['#f7a8b8','#f9cf8e','#d3b3e5'][i%3];
      c.beginPath();c.moveTo(x,y);c.quadraticCurveTo(x+w,y+w*.4,x+w,y+w*1.4);c.quadraticCurveTo(x+w,y+w*2.2,x,y+w*2.5);c.quadraticCurveTo(x-w,y+w*2.2,x-w,y+w*1.4);c.quadraticCurveTo(x-w,y+w*.4,x,y);c.fill();
      c.fillStyle='#fff8e0';c.beginPath();c.ellipse(x,y+w*1.3,w*.45,w*.75,0,0,7);c.fill();
      c.fillStyle='#c9a0b0';c.fillRect(x-w*.28,y+w*2.5,w*.56,w*.18);}}
  else if(bg==='sprinkles'){c.fillStyle='#eef4fd';c.fillRect(0,0,W,H);
    const cols=['#a8c8ec','#d3b3e5','#f9cf8e','#a8dcb5','#f7a8b8'];
    for(let i=0;i<22;i++){const x=W*((i*37+11)%94)/100+W*.03,y=H*((i*19+7)%90)/100+H*.05;star5(c,x,y,H*(.012+(i%3)*.005),cols[i%5]);}}
  else drawLayout(c,'blank',W,H);}
function drawBg(c,W,H){const bg=curPage().bg;
  if(LAYOUTS.some(l=>l[0]===bg))drawLayout(c,bg,W,H);else drawScene(c,bg,W,H);}

/* ================= stroke rendering ================= */
function drawStroke(c,s){
  c.save();c.lineCap='round';c.lineJoin='round';
  if(s.kind==='stroke'){
    if(s.tool==='eraser'){c.globalCompositeOperation='destination-out';c.strokeStyle='rgba(0,0,0,1)';c.globalAlpha=1;}
    else if(s.tool==='marker'){c.globalAlpha=.35;c.strokeStyle=s.color;}
    else{c.strokeStyle=s.color;}
    const p=s.points;
    for(let i=1;i<p.length;i++){
      const pf=s.tool==='pen'?(p[i][2]||1):1;
      c.lineWidth=SZ(s.size)*(s.tool==='eraser'?3:s.tool==='marker'?4:1)*pf;
      c.beginPath();c.moveTo(X(p[i-1][0]),Y(p[i-1][1]));c.lineTo(X(p[i][0]),Y(p[i][1]));c.stroke();}
    if(p.length===1){c.lineWidth=SZ(s.size)*(s.tool==='marker'?4:1);c.beginPath();c.moveTo(X(p[0][0]),Y(p[0][1]));c.lineTo(X(p[0][0])+.5,Y(p[0][1]));c.stroke();}
  }else if(s.kind==='shape'){
    c.globalAlpha=1;c.strokeStyle=s.color;c.lineWidth=SZ(s.size);
    drawShape(c,s.shape,X(s.x0),Y(s.y0),X(s.x1),Y(s.y1));
  }else if(s.kind==='text'){
    c.globalAlpha=1;c.fillStyle=s.color;c.direction='rtl';c.textAlign='right';c.textBaseline='top';
    c.font='700 '+SZ(s.size)+'px '+(s.font||'Naskh')+', serif';
    s.lines.forEach((ln,i)=>c.fillText(ln,X(s.x),Y(s.y)+i*SZ(s.size)*1.5));
  }else if(s.kind==='image'&&s._img){c.globalAlpha=1;c.drawImage(s._img,X(s.x),Y(s.y),X(s.w),Y(s.h));}
  else if(s.kind==='sticker'){c.globalAlpha=1;drawSticker(c,s.name,X(s.x),Y(s.y),SZ(s.size));}
  else if(s.kind==='stamp'){c.globalAlpha=1;drawStamp(c,s,X(s.x),Y(s.y),SZ(s.size||.05));}
  else if(s.kind==='mag'){c.globalAlpha=1;c.textAlign='center';c.textBaseline='middle';c.direction='rtl';
    const sz=SZ(s.size),step=sz*1.08;c.font='700 '+sz*.72+'px Naskh, serif';
    s.letters.forEach((ch,i)=>{const col=PALETTE[(i+2)%8];const xx=X(s.x)-(i-(s.letters.length-1)/2)*step;
      c.fillStyle=col;c.strokeStyle='rgba(124,45,73,.35)';c.lineWidth=sz*.045;
      c.beginPath();c.roundRect(xx-step*.47,Y(s.y)-sz*.62,step*.94,sz*1.24,sz*.16);c.fill();c.stroke();
      c.fillStyle='#fff';c.fillText(ch,xx,Y(s.y)+sz*.05);});}
  else if(s.kind==='quran'){c.globalAlpha=1;drawQuranCard(c,s);}

function drawShape(c,sh,x0,y0,x1,y1){
  c.beginPath();
  if(sh==='line'){c.moveTo(x0,y0);c.lineTo(x1,y1);c.stroke();}
  else if(sh==='arrow'){c.moveTo(x0,y0);c.lineTo(x1,y1);c.stroke();
    const a=Math.atan2(y1-y0,x1-x0),h=16+6*Math.min(4,Math.hypot(x1-x0,y1-y0)/120);
    c.beginPath();c.moveTo(x1,y1);c.lineTo(x1-h*Math.cos(a-.45),y1-h*Math.sin(a-.45));
    c.moveTo(x1,y1);c.lineTo(x1-h*Math.cos(a+.45),y1-h*Math.sin(a+.45));c.stroke();}
  else if(sh==='rect'){c.strokeRect(Math.min(x0,x1),Math.min(y0,y1),Math.abs(x1-x0),Math.abs(y1-y0));}
  else if(sh==='ellipse'){c.ellipse((x0+x1)/2,(y0+y1)/2,Math.abs(x1-x0)/2,Math.abs(y1-y0)/2,0,0,7);c.stroke();}
  else if(sh==='triangle'){c.moveTo((x0+x1)/2,Math.min(y0,y1));c.lineTo(Math.max(x0,x1),Math.max(y0,y1));c.lineTo(Math.min(x0,x1),Math.max(y0,y1));c.closePath();c.stroke();}
  else if(sh==='star'){const cx=(x0+x1)/2,cy=(y0+y1)/2,R=Math.max(Math.abs(x1-x0),Math.abs(y1-y0))/2,r=R*.45;
    c.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rad=i%2?r:R;const px=cx+rad*Math.cos(a),py=cy+rad*Math.sin(a);i?c.lineTo(px,py):c.moveTo(px,py);}c.closePath();c.stroke();}}
function redraw(){
  [bgCtx,ctx].forEach(c=>{c.setTransform(1,0,0,1,0,0);c.clearRect(0,0,cv.width,cv.height);c.setTransform(dpr,0,0,dpr,0,0);});
  drawBg(bgCtx,cssW,cssH);
  curPage().strokes.forEach(s=>drawStroke(ctx,s));
  if(preview)drawStroke(ctx,preview);}

function drawSticker(c,name,x,y,s){
  c.save();c.translate(x,y);
  if(name==='star')star5(c,0,0,s/2,'#f9cf8e');
  else if(name==='heart')heart(c,0,-s*.1,s/2,'#f7a8b8');
  else if(name==='crescent'){c.fillStyle='#f9e9a8';c.beginPath();c.arc(0,0,s/2,0,7);c.fill();c.fillStyle='rgba(255,255,255,.85)';c.beginPath();c.arc(s*.16,-s*.08,s*.42,0,7);c.fill();c.strokeStyle='#d9a44f';c.lineWidth=s*.045;c.beginPath();c.arc(0,0,s/2,0,7);c.stroke();}
  else if(name==='flower'){for(let p=0;p<5;p++){const a=p*2*Math.PI/5-Math.PI/2;c.fillStyle='#d3b3e5';c.beginPath();c.arc(s*.3*Math.cos(a),s*.3*Math.sin(a),s*.22,0,7);c.fill();}c.fillStyle='#f9e9a8';c.beginPath();c.arc(0,0,s*.16,0,7);c.fill();}
  else if(name==='sun'){c.strokeStyle='#f9cf8e';c.lineWidth=s*.07;for(let i=0;i<8;i++){const a=i*Math.PI/4;c.beginPath();c.moveTo(s*.32*Math.cos(a),s*.32*Math.sin(a));c.lineTo(s*.48*Math.cos(a),s*.48*Math.sin(a));c.stroke();}c.fillStyle='#f9e9a8';c.beginPath();c.arc(0,0,s*.26,0,7);c.fill();}
  else if(name==='balloon'){c.fillStyle='#f7a8b8';c.beginPath();c.ellipse(0,-s*.12,s*.3,s*.38,0,0,7);c.fill();c.strokeStyle='#c9a0b0';c.lineWidth=2;c.beginPath();c.moveTo(0,s*.28);c.quadraticCurveTo(s*.1,s*.42,0,s*.55);c.stroke();}
  else if(name==='butterfly'){c.fillStyle='#d3b3e5';c.beginPath();c.ellipse(-s*.22,-s*.1,s*.22,s*.28,-.5,0,7);c.ellipse(s*.22,-s*.1,s*.22,s*.28,.5,0,7);c.fill();c.fillStyle='#e8a4c0';c.beginPath();c.ellipse(-s*.18,s*.18,s*.15,s*.18,-.5,0,7);c.ellipse(s*.18,s*.18,s*.15,s*.18,.5,0,7);c.fill();c.strokeStyle='#7c2d49';c.lineWidth=2;c.beginPath();c.moveTo(0,-s*.3);c.lineTo(0,s*.3);c.stroke();}
  else if(name==='fish'){c.fillStyle='#a8c8ec';c.beginPath();c.ellipse(0,0,s*.35,s*.22,0,0,7);c.fill();c.beginPath();c.moveTo(s*.3,0);c.lineTo(s*.52,-s*.18);c.lineTo(s*.52,s*.18);c.closePath();c.fill();c.fillStyle='#7c2d49';c.beginPath();c.arc(-s*.18,-s*.05,s*.035,0,7);c.fill();}
  else if(name==='apple'){c.fillStyle='#e05c5c';c.beginPath();c.arc(-s*.1,s*.05,s*.24,0,7);c.arc(s*.1,s*.05,s*.24,0,7);c.fill();c.strokeStyle='#8a5a2b';c.lineWidth=s*.05;c.beginPath();c.moveTo(0,-s*.15);c.quadraticCurveTo(s*.05,-s*.32,s*.12,-s*.38);c.stroke();c.fillStyle='#3aa77c';c.beginPath();c.ellipse(s*.18,-s*.28,s*.14,s*.07,.5,0,7);c.fill();}
  else if(name==='crown'){c.fillStyle='#f9cf8e';c.beginPath();c.moveTo(-s*.4,s*.2);c.lineTo(-s*.4,-s*.2);c.lineTo(-s*.2,0);c.lineTo(0,-s*.35);c.lineTo(s*.2,0);c.lineTo(s*.4,-s*.2);c.lineTo(s*.4,s*.2);c.closePath();c.fill();c.fillStyle='#d9a44f';c.fillRect(-s*.4,s*.2,s*.8,s*.1);}
  else if(name==='moon2'){crescent(c,0,0,s*.4,'#f9e9a8');}
  else if(name==='cloudS'){cloud(c,0,0,s*.28,'#eaf4fb');c.strokeStyle='#bcd6f5';c.lineWidth=2;cloud(c,0,0,s*.28,'rgba(255,255,255,0)');}
  c.restore();}
const STICKERS=['star','heart','crescent','flower','sun','balloon','butterfly','fish','apple','crown'];
const STAMPS=[['أَحْسَنْتِ','#d9a44f'],['مُمْتَاز','#d16a92'],['رَائِع','#7a54c9'],['بْرَافُو','#3aa77c'],['صَحِيح','#4f7fd9'],['حَاوِلِي مَرَّةً أُخْرَى','#e05c5c']];
function drawStamp(c,s,x,y,h){
  c.save();c.translate(x,y);c.rotate(-.06);
  c.font='700 '+h+'px Naskh, serif';c.textAlign='center';c.textBaseline='middle';c.direction='rtl';
  const w=c.measureText(s.text).width+h*1.7;
  c.fillStyle=s.color;c.globalAlpha=.92;
  c.beginPath();c.roundRect(-w/2,-h*.75,w,h*1.5,h*.75);c.fill();
  c.globalAlpha=1;c.strokeStyle='#fff';c.lineWidth=h*.09;c.beginPath();c.roundRect(-w/2+h*.1,-h*.75+h*.1,w-h*.2,h*1.5-h*.2,h*.6);c.stroke();
  c.fillStyle='#fff';c.fillText(s.text,h*.35,0);
  star5(c,-w/2+h*.55,0,h*.32,'#fff');
  c.restore();}

let drawing=false,cur=null,preview=null,shapeStart=null,activePtr=null,penActive=false,curSticker='star',curStamp=STAMPS[0];
function toWorld(e){return [e.clientX/cssW,e.clientY/cssH];}
function pfactor(e){return (tool==='pen'&&e.pointerType==='pen'&&e.pressure>0)?.35+1.3*e.pressure:1;}
cv.addEventListener('pointerdown',e=>{
  if(readOnly||activePtr!==null)return;

  if(tool==='shapes'){shapeStart=[x,y];drawing=true;return;}
  drawing=true;cur={kind:'stroke',tool,color,size:penSize/1000,points:[[x,y,pfactor(e)]]};
  pushUndo();curPage().strokes.push(cur);});
cv.addEventListener('pointermove',e=>{
  if(!drawing||e.pointerId!==activePtr)return;
  const [x,y]=toWorld(e);
  if(tool==='shapes'&&shapeStart){preview={kind:'shape',shape,color,size:penSize/1000,x0:shapeStart[0],y0:shapeStart[1],x1:x,y1:y};redraw();return;}
  if(cur){const pts=cur.points,last=pts[pts.length-1];
    if(Math.hypot((x-last[0])*cssW,(y-last[1])*cssH)>1.5){pts.push([x,y,pfactor(e)]);redraw();}}});
function detectShape(p){ /* smart shapes on normalized points */
  if(p.length<6)return null;
  const xs=p.map(q=>q[0]),ys=p.map(q=>q[1]);
  const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  const w=(x1-x0)*cssW,h=(y1-y0)*cssH,len=p.reduce((a,q,i)=>i?a+Math.hypot((q[0]-p[i-1][0])*cssW,(q[1]-p[i-1][1])*cssH):0,0);
  if(len<24)return null;
  /* straight line? */
  const ax=p[0],bx=p[p.length-1],L=Math.hypot((bx[0]-ax[0])*cssW,(bx[1]-ax[1])*cssH);
  if(L>24){let mx=0;for(const q of p){const d=Math.abs((bx[0]-ax[0])*cssW*(Y(ax[1])-Y(q[1]))-(X(ax[0])-X(q[0]))*(bx[1]-ax[1])*cssH)/(L||1);mx=Math.max(mx,d);}
    if(mx/L<.04)return{shape:'line',x0:ax[0],y0:ax[1],x1:bx[0],y1:bx[1]};}
  /* closed? */
  const close=Math.hypot((bx[0]-ax[0])*cssW,(bx[1]-ax[1])*cssH)<Math.max(w,h)*.3;
  if(close&&w>20&&h>20){
    let corners=0,lastC=-9;
    for(let i=3;i<p.length-3;i++){
      const a1=Math.atan2((p[i][1]-p[i-3][1])*cssH,(p[i][0]-p[i-3][0])*cssW);
      const a2=Math.atan2((p[i+3][1]-p[i][1])*cssH,(p[i+3][0]-p[i][0])*cssW);
      let d=Math.abs(a2-a1);if(d>Math.PI)d=2*Math.PI-d;
      if(d>.85&&i-lastC>5){corners++;lastC=i;}}
    if(corners>=3&&corners<=5)return{shape:'rect',x0,y0,x1,y1};
    const cx=(x0+x1)/2,cy=(y0+y1)/2;let rs=[];
    for(const q of p)rs.push(Math.hypot((q[0]-cx)*cssW,(q[1]-cy)*cssH));
    const rm=rs.reduce((a,b)=>a+b)/rs.length,dv=Math.sqrt(rs.reduce((a,b)=>a+(b-rm)**2,0)/rs.length)/rm;
    if(dv<.2)return{shape:'ellipse',x0,y0,x1,y1};
    if(dv<.6&&len>1.4*(w+h))return{shape:'rect',x0,y0,x1,y1};}
  return null;}
function endStroke(e){
  if(!drawing||(e&&e.pointerId!==activePtr))return;

  if(tool==='shapes'&&shapeStart&&preview){pushUndo();curPage().strokes.push(preview);}
  else if(cur&&smartOn&&cur.tool==='pen'){
    const det=detectShape(cur.points);
    if(det){curPage().strokes.pop();undoStack.pop();
      pushUndo();curPage().strokes.push({kind:'shape',shape:det.shape,color,size:penSize/1000,x0:det.x0,y0:det.y0,x1:det.x1,y1:det.y1});
      toast('تحوّلت لشكل '+({line:'خط',ellipse:'دائرة',rect:'مستطيل'}[det.shape]||''));}
    else if(cur.points.length===1)cur.points.push([cur.points[0][0]+.0001,cur.points[0][1],1]);}
  cur=null;preview=null;shapeStart=null;redraw();save();liveDirty();}

/* ================= export ================= */
function renderPageToCanvas(page,W,H){
  const off=document.createElement('canvas');off.width=W;off.height=H;const c=off.getContext('2d');
  const keep={W:cssW,H:cssH};cssW=W;cssH=H;
  const keepPage=state.cur;state.cur=state.pages.indexOf(page);
  drawBg(c,W,H);page.strokes.forEach(s=>drawStroke(c,s));
  state.cur=keepPage;cssW=keep.W;cssH=keep.H;return off;}
document.getElementById('pngBtn').onclick=()=>{
  const off=renderPageToCanvas(curPage(),1600,Math.round(1600*cssH/cssW));
  const a=document.createElement('a');a.download='سبورة-صفحة-'+arNum(state.cur+1)+'.png';a.href=off.toDataURL('image/png');a.click();
  toast('نزّلت الصفحة صورة');};
document.getElementById('pdfBtn').onclick=async()=>{
  try{const {jsPDF}=window.jspdf;
    const W=1600,H=Math.round(1600*cssH/cssW);
    const pdf=new jsPDF({orientation:'landscape',unit:'px',format:[W,H],hotfixes:['px_scaling']});
    state.pages.forEach((p,i)=>{if(i)pdf.addPage([W,H],'landscape');pdf.addImage(renderPageToCanvas(p,W,H).toDataURL('image/jpeg',.92),'JPEG',0,0,W,H);});
    pdf.save('سبورة-ليسانورا.pdf');toast('نزّلت الصفحات PDF');}
  catch(e){const w=window.open('','_blank');if(!w){toast('اسمحي بالنوافذ المنبثقة');return;}
    const imgs=state.pages.map(p=>renderPageToCanvas(p,1600,Math.round(1600*cssH/cssW)).toDataURL('image/png'));
    w.document.write('<html dir="rtl"><head><title>سبورة ليسانورا</title><style>body{margin:0}img{width:100%;page-break-after:always;display:block}</style></head><body>'+imgs.map(s=>'<img src="'+s+'">').join('')+'<script>onload=()=>setTimeout(()=>print(),400)<\/script></body></html>');w.document.close();}};

document.getElementById('shareBtn').onclick=()=>{openSharePanel();};
function snapshotLink(){
  const json=JSON.stringify(state,(k,v)=>k==='_img'?undefined:v);
  return location.origin+location.pathname+'#s='+LZString.compressToEncodedURIComponent(json);}
function loadFromHash(){
  const h=location.hash;const liveM=h.match(/[#&]live=([A-Za-z0-9-]+)/);const sM=h.match(/[#&]s=([A-Za-z0-9+/%$()-]+)/);
  if(liveM){joinLive(liveM[1]);return true;}
  if(sM){const v=decodeURIComponent(sM[1]);
    if(/^[A-Za-z0-9]{6,12}$/.test(v)&&window.LN&&LN.configured()){ /* short cloud share id */
      LN.init().then(()=>LN.loadShared(v)).then(s=>{
        if(s&&s.pages){state=s;readOnly=false;rehydrate();fit();syncPageUI();toast('فتحتِ سبورة مشارَكة');}
        else toast('رابط المشاركة غير صالح');});
      return true;}
    try{const s=JSON.parse(LZString.decompressFromEncodedURIComponent(v));
    if(s&&s.pages){state=s;readOnly=false;rehydrate();toast('فتحتِ سبورة مشارَكة');}}catch(e){}return true;}
  return false;}

/* ================= toast / beep / confetti ================= */
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';clearTimeout(t._x);t._x=setTimeout(()=>t.style.display='none',2200);}
function beep(f,d){try{const ac=new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();
  o.frequency.value=f||880;o.connect(g);g.connect(ac.destination);g.gain.setValueAtTime(.16,ac.currentTime);o.start();o.stop(ac.currentTime+(d||.15));}catch(e){}}
let confCv=null;
function celebrate(){
  if(!confCv){confCv=document.createElement('canvas');confCv.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:60';document.body.appendChild(confCv);}
  confCv.width=innerWidth;confCv.height=innerHeight;const c=confCv.getContext('2d');
  const P=[];for(let i=0;i<140;i++)P.push({x:Math.random()*innerWidth,y:-20-Math.random()*innerHeight*.3,vx:(Math.random()-.5)*2,vy:2+Math.random()*3,s:6+Math.random()*8,a:Math.random()*6.3,va:(Math.random()-.5)*.3,col:PALETTE[i%8]});
  const t0=performance.now();
  (function anim(t){const el=t-t0;c.clearRect(0,0,confCv.width,confCv.height);
    P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.a+=p.va;c.save();c.translate(p.x,p.y);c.rotate(p.a);c.fillStyle=p.col;c.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);c.restore();});
    if(el<2600)requestAnimationFrame(anim);else c.clearRect(0,0,confCv.width,confCv.height);})(t0);
  beep(523,.12);setTimeout(()=>beep(659,.12),130);setTimeout(()=>beep(784,.22),260);}

let zTop=50;const cards={};
function makeCard(id,title,build){
  const old=document.getElementById('fc-'+id);if(old){old.style.zIndex=++zTop;return;}
  const card=document.createElement('div');card.className='fcard';card.id='fc-'+id;
  card.style.zIndex=++zTop;
  card.innerHTML='<div class="fhead"><span>'+title+'</span><button class="fx">✕</button></div><div class="fbody"></div>';
  document.body.appendChild(card);
  card.querySelector('.fx').onclick=()=>{delete cards[id];card.remove();};
  card.addEventListener('pointerdown',()=>{card.style.zIndex=++zTop;});
  const head=card.querySelector('.fhead');
  head.addEventListener('pointerdown',e=>{if(e.target.classList.contains('fx'))return;
    e.preventDefault();try{head.setPointerCapture(e.pointerId);}catch(_){}
    const r=card.getBoundingClientRect(),sx=e.clientX,sy=e.clientY;
    card.style.left=r.left+'px';card.style.top=r.top+'px';card.style.insetInlineStart='auto';
    function mv(ev){let nx=r.left+ev.clientX-sx,ny=r.top+ev.clientY-sy;
      nx=Math.min(Math.max(nx,8),Math.max(8,innerWidth-r.width-8));
      ny=Math.min(Math.max(ny,6),Math.max(6,innerHeight-r.height-8));
      card.style.transform='translate3d('+(nx-r.left)+'px,'+(ny-r.top)+'px,0)';}
    function up(){removeEventListener('pointermove',mv);removeEventListener('pointerup',up);
      const r2=card.getBoundingClientRect();
      card.style.transform='';card.style.left=r2.left+'px';card.style.top=r2.top+'px';}
    addEventListener('pointermove',mv);addEventListener('pointerup',up);});
  build(card.querySelector('.fbody'));cards[id]=card;
  /* open centered horizontally, below the top bar, fully inside the screen */
  const k=Object.keys(cards).length-1,w=card.offsetWidth,h=card.offsetHeight;
  let left=Math.round((innerWidth-w)/2);left=Math.min(Math.max(left,8),Math.max(8,innerWidth-w-8));
  let top=70+k*24;top=Math.min(top,Math.max(70,innerHeight-h-16));
  card.style.left=left+'px';card.style.top=top+'px';}
document.querySelectorAll('.witem').forEach(b=>b.addEventListener('click',()=>{
  const w=b.dataset.w;wPanel.classList.remove('open');
  if(w==='timer')makeCard('timer','المؤقِّت',buildTimer);
  if(w==='stopwatch')makeCard('stopwatch','ساعة الإيقاف',buildStopwatch);

  if(w==='picker')makeCard('picker','اختيار عشوائي',buildPicker);
  if(w==='score')makeCard('score','لوحة النقاط',buildScore);
  if(w==='traffic')makeCard('traffic','إشارة المرور',buildTraffic);
  if(w==='counter')makeCard('counter','عدّاد التكرار',buildCounter);
  if(w==='party')celebrate();}));
function buildTimer(body){

    +'<div class="row"><button class="abtn ghost" data-m="1">١ د</button><button class="abtn ghost" data-m="3">٣ د</button><button class="abtn ghost" data-m="5">٥ د</button><button class="abtn ghost" data-m="10">١٠ د</button></div>'
    +'<div class="row"><button class="abtn" data-a="start">ابدأ</button><button class="abtn blue" data-a="pause">وقف</button><button class="abtn ghost" data-a="reset">صفر</button></div>';

  body.querySelector('[data-a=pause]').onclick=()=>{clearInterval(iv);iv=null;};

function buildStopwatch(body){
  body.innerHTML='<div class="bigtime">٠:٠٠</div>'
    +'<div class="row"><button class="abtn" data-a="start">ابدأ</button><button class="abtn blue" data-a="pause">وقف</button><button class="abtn ghost" data-a="reset">صفر</button></div>';

const WHEELCOLORS=['#d16a92','#d9a44f','#4f7fd9','#3aa77c','#e05c5c','#7a54c9','#8a5a2b','#7c2d49'];
function buildWheel(body){
  body.innerHTML='<textarea placeholder="اكتبي اسم في كل سطر">أحمد\nفاطمة\nيوسف\nمريم\nخديجة\nعمر</textarea>'
    +'<canvas id="wheelCv" width="260" height="260"></canvas>'
    +'<div class="row"><button class="abtn gold">أديري العجلة</button></div><div class="wres" style="font-family:Naskh,serif;font-size:24px;font-weight:700;color:var(--rose-d);min-height:32px"></div>';
  const ta=body.querySelector('textarea'),wc=body.querySelector('#wheelCv'),res=body.querySelector('.wres');
  const c=wc.getContext('2d');let angle=0,spinning=false;
  function names(){return ta.value.split('\n').map(s=>s.trim()).filter(Boolean);}
  function paint(){const ns=names();const N=Math.max(ns.length,1);const step=2*Math.PI/N;
    c.clearRect(0,0,260,260);const cx=130,cy=130,R=124;
    for(let i=0;i<N;i++){const a0=angle+i*step,mid=a0+step/2;
      c.beginPath();c.moveTo(cx,cy);c.arc(cx,cy,R,a0,a0+step);c.closePath();c.fillStyle=WHEELCOLORS[i%8];c.fill();
      if(!ns[i])continue;
      /* name written along the radius, upright, auto-shrunk to fit its segment */
      c.save();c.translate(cx,cy);c.rotate(mid);
      const flip=Math.cos(mid)<0;if(flip)c.rotate(Math.PI);
      const rIn=30,rOut=R-10,span=rOut-rIn,rT=(rIn+rOut)/2;
      let fs=Math.min(18,2*rT*Math.sin(Math.min(step,Math.PI)/2)*0.75);
      c.fillStyle='#fff';c.textAlign='center';c.textBaseline='middle';c.direction='rtl';
      while(fs>8){c.font='700 '+fs+'px Naskh, serif';if(c.measureText(ns[i]).width<=span)break;fs--;}
      c.font='700 '+Math.max(8,fs)+'px Naskh, serif';
      let label=ns[i];
      if(c.measureText(label).width>span){while(label.length>1&&c.measureText(label+'…').width>span)label=label.slice(0,-1);label=label+'…';}
      c.fillText(label,flip?-rT:rT,0);c.restore();}
    c.fillStyle='#7c2d49';c.beginPath();c.moveTo(cx-2,cy-R-6);c.lineTo(cx-14,cy-R+16);c.lineTo(cx+10,cy-R+16);c.closePath();c.fill();
    c.beginPath();c.arc(cx,cy,16,0,7);c.fillStyle='#fff';c.fill();c.strokeStyle='#7c2d49';c.lineWidth=3;c.stroke();}
  ta.addEventListener('input',paint);
  body.querySelector('.abtn').onclick=()=>{const ns=names();if(!ns.length||spinning)return;
    spinning=true;res.textContent='';const N=ns.length,winIdx=Math.floor(Math.random()*N);
    const target=(Math.PI*3/2)-(winIdx+.5)*2*Math.PI/N,spins=12*Math.PI;
    const start=angle%(2*Math.PI);let delta=target-start;while(delta<0)delta+=2*Math.PI;
    const total=spins+delta,T=4200,t0=performance.now();beep(660,.12);
    (function anim(now){const p=Math.min(1,(now-t0)/T),e=1-Math.pow(1-p,4);
      angle=start+total*e;paint();
      if(p<1)requestAnimationFrame(anim);
      else{spinning=false;res.textContent=ns[winIdx];celebrate();}})(t0);};
  paint();}
function buildPicker(body){
  body.innerHTML='<textarea placeholder="اكتبي اسم في كل سطر">أحمد\nفاطمة\nيوسف\nمريم\nخديجة\nعمر</textarea>'

  btn.onclick=()=>{const ns=ta.value.split('\n').map(s=>s.trim()).filter(Boolean);
    if(!ns.length||busy)return;busy=true;let i=0;
    const iv=setInterval(()=>{out.textContent=ns[Math.floor(Math.random()*ns.length)];beep(500+i*18,.05);
      if(++i>16){clearInterval(iv);out.textContent=ns[Math.floor(Math.random()*ns.length)];celebrate();busy=false;}},90);};}
function buildScore(body){

    row.innerHTML='<button class="pm">+</button><input value="'+(i?'فريق ٢':'فريق ١')+'"><span class="sc">٠</span><button class="pm minus">−</button>';

function drawQuranCard(c,s){
  const w=X(s.w),pad=SZ(s.size)*.9,lh=SZ(s.size)*2.1,refH=SZ(s.size)*1.4;
  const h=s.lines.length*lh+pad*2+refH;
  const x=X(s.x)-w/2,y=Y(s.y)-h/2;
  c.save();
  c.fillStyle='#fffdf6';c.strokeStyle='#d9a44f';c.lineWidth=SZ(s.size)*.12;
  c.beginPath();c.roundRect(x,y,w,h,SZ(s.size)*.3);c.fill();c.stroke();
  c.strokeStyle='rgba(217,164,79,.5)';c.lineWidth=SZ(s.size)*.05;
  c.beginPath();c.roundRect(x+pad*.5,y+pad*.5,w-pad,h-pad,SZ(s.size)*.22);c.stroke();
  c.fillStyle='#3d2b33';c.direction='rtl';c.textAlign='center';c.textBaseline='middle';
  c.font='400 '+SZ(s.size)+'px "Amiri Quran", Naskh, serif';
  s.lines.forEach((ln,i)=>c.fillText(ln,x+w/2,y+pad+i*lh+lh/2));
  c.fillStyle='#8a6512';c.font='700 '+SZ(s.size)*.55+'px Naskh, serif';
  c.fillText(s.ref,x+w/2,y+h-refH/2-pad*.3);
  c.restore();}

function buildQuran(body){
  body.innerHTML='<select id="qSurah"></select><div class="row" style="width:100%"><select id="qFrom" style="flex:1"></select><select id="qTo" style="flex:1"></select></div>'
    +'<select id="qRec"></select><div class="qres" id="qPrev">اختاري السورة والآيات</div>'
    +'<div class="row"><button class="abtn blue" id="qPlay">استماع</button><button class="abtn" id="qAdd">أضيفي للسبورة</button></div>';
  const sSel=body.querySelector('#qSurah'),fSel=body.querySelector('#qFrom'),tSel=body.querySelector('#qTo'),rSel=body.querySelector('#qRec'),prev=body.querySelector('#qPrev');
  SURAHS.forEach(s=>sSel.add(new Option(s[1],s[0])));
  RECITERS.forEach(r=>rSel.add(new Option(r[1],r[0])));
  function fillAyat(){const n=SURAHS[sSel.value-1][2];fSel.innerHTML='';tSel.innerHTML='';
    for(let i=1;i<=n;i++){fSel.add(new Option('من آية '+arNum(i),i));tSel.add(new Option('إلى آية '+arNum(i),i));}
    tSel.value=Math.min(3,n);}
  sSel.onchange=fillAyat;fillAyat();
  let curAyat=[];
  async function loadPrev(){prev.textContent='جاري التحميل...';
    try{const s=+sSel.value,f=+fSel.value,t=Math.max(f,+tSel.value);
      if(t-f>10){prev.textContent='اختاري حتى ١٠ آيات في المرة';return;}
      curAyat=[];for(let a=f;a<=t;a++){const d=await qfetch(s+':'+a);curAyat.push(d);}
      prev.textContent=curAyat.map(d=>d.text).join(' ﴿'+''+'﴾ ');
      prev.textContent=curAyat.map((d,i)=>'﴿'+d.text+'﴾ '+arNum(+fSel.value+i)).join(' ');}
    catch(e){prev.textContent='تعذر التحميل، تأكدي من الاتصال';}}
  fSel.onchange=loadPrev;tSel.onchange=loadPrev;sSel.addEventListener('change',loadPrev);
  let audio=null;
  body.querySelector('#qPlay').onclick=()=>{
    if(audio){audio.pause();audio=null;return;}
    if(!curAyat.length){loadPrev();return;}
    const rec=rSel.value;let i=0;
    const playNext=()=>{if(i>=curAyat.length){audio=null;return;}
      const g=SURAH_START[curAyat[i].surah.number-1]+curAyat[i].numberInSurah-1;
      audio=new Audio('https://cdn.islamic.network/quran/audio/128/'+rec+'/'+g+'.mp3');
      audio.onended=()=>{i++;playNext();};audio.play();};
    playNext();toast('استماع للآيات...');};
  body.querySelector('#qAdd').onclick=async()=>{
    if(!curAyat.length)await loadPrev();
    if(!curAyat.length)return;
    try{await document.fonts.load('40px "Amiri Quran"');}catch(e){}
    const size=.042,maxW=.72;
    const mc=document.createElement('canvas').getContext('2d');
    mc.font='400 '+(size*1000)+'px "Amiri Quran", Naskh, serif';
    const lines=[];const f=+fSel.value;
    curAyat.forEach((d,ai)=>{
      const words=('﴿'+d.text+'﴾ '+arNum(f+ai)).split(' ');let line='';
      words.forEach(wd=>{const t=line?line+' '+wd:wd;
        if(mc.measureText(t).width>maxW*1000&&line){lines.push(line);line=wd;}else line=t;});
      if(line)lines.push(line);});
    pushUndo();
    curPage().strokes.push({kind:'quran',x:.5,y:.28,w:maxW,lines,ref:curAyat[0].surah.name+' - الآيات '+arNum(f)+' - '+arNum(f+curAyat.length-1),size});
    closeCard('quran');redraw();save();liveDirty();toast('أُضيفت الآيات بِسْمِ الله');};
  loadPrev();}

    let link=null;
    if(window.LN&&LN.configured()&&LN.user){ /* signed in: short cloud link */
      st.textContent='جاري تجهيز الرابط...';
      try{const id=await LN.shareBoard(JSON.parse(JSON.stringify(state,(k,v)=>k==='_img'?undefined:v)));
        link=location.origin+location.pathname+'#s='+id;}catch(e){}}
    if(!link)link=snapshotLink(); /* guest fallback: long encoded link */
    try{await navigator.clipboard.writeText(link);st.textContent='اتنسخ الرابط، ابعتيه للطالب';}
    catch(e){st.textContent='انسخي الرابط يدويًا';}
    out.textContent=link;};
  body.querySelector('#goLive').onclick=async()=>{
    if(window.LN&&LN.configured()){
      if(!LN.user){st.textContent='سجلي الدخول من زر حسابي الأول، وبعدين ابدئي البث';return;}
      if(window.LN_LIVE){st.textContent='البث شغال بالفعل';return;}
      st.textContent='جاري تجهيز البث...';
      try{
        await LN.liveStart(n=>{st.textContent=n>0?'متصل: '+arNum(n)+' طالب':'البث شغال، في انتظار الطلاب';});
        window.LN_LIVE=true;
        const link=location.origin+location.pathname+'#live='+LN.teacherCode();
        out.textContent=link;
        try{await navigator.clipboard.writeText(link);st.textContent='البث شغال - الرابط اتنسخ، ابعتيه للطالب';}
        catch(e){st.textContent='البث شغال - انسخي الرابط';}
        liveDirty();
      }catch(e){st.textContent=e.message;}
      return;}
    if(peer){st.textContent='البث شغال: '+liveId;return;}
    if(!window.Peer){st.textContent='تعذر تحميل مكتبة البث';return;}
    st.textContent='جاري تجهيز البث...';
    liveId='lisanura-'+Math.random().toString(36).slice(2,8);
    peer=new Peer(liveId);
    peer.on('open',async()=>{const link=location.origin+location.pathname+'#live='+liveId;
      out.textContent=link;
      try{await navigator.clipboard.writeText(link);st.textContent='البث شغال - الرابط اتنسخ، ابعتيه للطالب';}
      catch(e){st.textContent='البث شغال - انسخي الرابط';}
      liveDirty();});
    peer.on('connection',cn=>{conns.push(cn);
      cn.on('open',()=>{st.textContent='متصل: '+arNum(conns.length)+' طالب';liveDirty();});
      cn.on('close',()=>{conns=conns.filter(x=>x!==cn);st.textContent=conns.length?'متصل: '+arNum(conns.length)+' طالب':'البث شغال بدون طلاب';});
      cn.on('data',d=>{if(d&&d.t==='hello')liveDirty();});});
    peer.on('error',err=>{st.textContent='خطأ في البث: '+err.type;});
    peer.on('disconnected',()=>{try{peer.reconnect();}catch(e){}});};}
function joinLive(hostId){
  readOnly=true;document.body.classList.add('viewer');
  const badge=document.createElement('div');badge.className='liveBadge';badge.textContent='بث مباشر من المعلمة...';document.body.appendChild(badge);
  if(window.LN&&LN.configured()){
    LN.init().then(()=>LN.liveJoin(hostId,
      data=>{try{state=JSON.parse(LZString.decompressFromEncodedURIComponent(data));rehydrate();syncPageUI();}catch(e){}},
      stt=>{badge.textContent=stt==='live'?'متصلة بالمعلمة':stt==='offline'?'المعلمة لسه ما بدأتش البث':'مشكلة اتصال، جاري المحاولة';}));
    return;}
  let p;
  const connect=()=>{try{p=new Peer();}catch(e){badge.textContent='تعذر الاتصال بالبث';return;}
    p.on('open',()=>{const cn=p.connect(hostId,{reliable:true});
      cn.on('open',()=>{badge.textContent='متصلة بالمعلمة';cn.send({t:'hello'});});
      cn.on('data',d=>{if(d&&d.t==='full'){try{state=JSON.parse(LZString.decompressFromEncodedURIComponent(d.data));
        rehydrate();syncPageUI();}catch(e){}}});
      cn.on('close',()=>{badge.textContent='انقطع البث، إعادة محاولة...';setTimeout(connect,4000);});});
    p.on('error',e=>{badge.textContent=e.type==='peer-unavailable'?'المعلمة لسه ما بدأتش البث، جاري المحاولة...':'مشكلة اتصال، إعادة محاولة...';
      if(e.type==='peer-unavailable'||e.type==='network'||e.type==='server-error')setTimeout(()=>{try{p.destroy();}catch(_){}connect();},4000);});};
  connect();}

/* ================= account ================= */
document.getElementById('acctBtn').onclick=()=>makeCard('acct','حسابي',buildAcct);
function buildAcct(body){
  if(!window.LN||!LN.configured()){body.innerHTML='<div style="color:var(--maroon);font-size:14px;text-align:center">الحسابات غير مفعّلة بعد</div>';return;}
  body.innerHTML='<div id="acctIn" style="width:100%"></div>';
  LN.init().then(()=>{
    const w=body.querySelector('#acctIn');
    if(!LN.user){LN.renderAuth(w,{onAuth:async()=>{closeCard('acct');await restoreFromCloud();toast('أهلاً بيكِ');}});return;}
    const p=LN.profile||{};const roleAr=p.role==='teacher'?'معلمة':'طالبة';
    let html='<div style="text-align:center;color:var(--maroon)"><b style="font-size:17px"></b><div style="font-size:13px;color:#a4748a">'+roleAr+'</div></div>';
    if(p.role==='teacher')html+='<div style="font-size:12px;color:#a4748a;text-align:center;margin-top:8px">كود المعلمة (تشاركيه مع الطلاب عند تسجيلهم):</div>'
      +'<div id="acCode" style="direction:ltr;font-size:11px;word-break:break-all;background:#fdf3f7;border-radius:8px;padding:6px;color:var(--rose-d)"></div>'
      +'<button class="abtn" id="acCopy" style="margin-top:6px">نسخ الكود</button>'
      +'<div id="acStudents" style="margin-top:8px;font-size:13px;color:var(--maroon);text-align:center">...</div>';
    html+='<button class="abtn ghost" id="acOut" style="margin-top:10px">تسجيل خروج</button>';
    w.innerHTML=html;
    w.querySelector('b').textContent=p.display_name||'';
    const codeEl=w.querySelector('#acCode');if(codeEl)codeEl.textContent=LN.teacherCode();
    const cp=w.querySelector('#acCopy');
    if(cp)cp.onclick=async()=>{try{await navigator.clipboard.writeText(LN.teacherCode());toast('اتنسخ الكود');}catch(e){}};
    const stEl=w.querySelector('#acStudents');
    if(stEl)LN.listStudents().then(ss=>{stEl.textContent='الطلاب المرتبطين: '+arNum(ss.length);});
    w.querySelector('#acOut').onclick=async()=>{await LN.signOut();location.reload();};});}

/* merge local guest pages into the cloud board instead of dropping them */
function mergeBoards(cloudState,localState){
  const sig=p=>JSON.stringify(p);
  const cloudSigs=new Set((cloudState.pages||[]).map(sig));
  const extra=(localState.pages||[]).filter(p=>p.strokes&&p.strokes.length&&!cloudSigs.has(sig(p)));
  if(extra.length)cloudState.pages=(cloudState.pages||[]).concat(extra);
  return extra.length;}
/* after login (home page or حسابي panel): bring her account's board, merging any guest work */
async function restoreFromCloud(){
  if(!isTeacherOnline()){setSaveState();return;}
  try{
    const cloud=await LN.loadBoard();
    const hasCloud=cloud&&cloud.state&&cloud.state.pages&&cloud.state.pages.length;
    const localHas=state.pages&&state.pages.some(p=>p.strokes&&p.strokes.length);
    if(hasCloud){
      const local=state;state=cloud.state;
      const added=mergeBoards(state,local);
      state.cur=0;rehydrate();fit();syncPageUI();
      if(added){toast('ضفنا شغلك المحلي كصفحات جديدة في حسابك');save();}
      else toast('رجعنا آخر سبورة محفوظة من حسابك');
    }else if(localHas){
      await LN.saveBoardNow(JSON.parse(JSON.stringify(state,(k,v)=>k==='_img'?undefined:v)));
      toast('شغلك اتسجل في حسابك');
    }
  }catch(e){}
  setSaveState();}

/* ================= boot ================= */
(async()=>{
  load();
  const fromHash=loadFromHash();
  rehydrate();fit();syncPageUI();
  /* no forced login here: sign-in lives on the site home page; the session is shared site-wide.
     A signed-in teacher gets her cloud board back; a guest just uses the board (local save). */
  try{if(window.LN&&LN.configured()){
    await LN.init();
    if(!fromHash)await restoreFromCloud();
    else setSaveState();}
  else setSaveState();
  }catch(e){setSaveState();}
  document.fonts&&document.fonts.load&&document.fonts.load('40px "Amiri Quran"');
  if(!fromHash&&matchMedia('(orientation: portrait)').matches&&innerWidth<760)setTimeout(()=>toast('لفّي الموبايل بالعرض لسبورة أكبر'),1200);
})();
</script>
